
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rangelab Recon Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#f6f4ee; --surface:#ffffff; --surface-2:#eeeadb; --surface-3:#e4ddc8;
  --text:#1c2129; --text-muted:#5b6472; --border:#ddd6c0;
  --accent:#a5591a; --accent-ink:#ffffff; --accent-soft:#f1e2d0;
  --success:#3f7a4f; --success-soft:#e2efe0;
  --warning:#a86a13; --warning-soft:#f3e6cd;
  --critical:#a3392f; --critical-soft:#f5e0dc;
  --focus:#2f6fed;
  --shadow: 0 1px 2px rgba(30,24,10,.06), 0 8px 24px -12px rgba(30,24,10,.18);
  --radius: 10px;
  --console-bg:#14120f; --console-bg-2:#1b1712; --console-border:#3a3226;
  --console-fg:#e3a039; --console-dim:#8a7a5c; --console-ok:#8fbf8f; --console-bad:#e08a7d; --console-info:#d8c9a3;
  font-synthesis: none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --surface:#181e26; --surface-2:#1f2631; --surface-3:#28313e;
    --text:#e8e6de; --text-muted:#9aa3af; --border:#2d3542;
    --accent:#e0983f; --accent-ink:#1a1206; --accent-soft:#3a2c17;
    --success:#4f9d63; --success-soft:#1c2a1f;
    --warning:#d19a3d; --warning-soft:#332811;
    --critical:#e2645a; --critical-soft:#331f1c;
    --focus:#6ea8ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#181e26; --surface-2:#1f2631; --surface-3:#28313e;
  --text:#e8e6de; --text-muted:#9aa3af; --border:#2d3542;
  --accent:#e0983f; --accent-ink:#1a1206; --accent-soft:#3a2c17;
  --success:#4f9d63; --success-soft:#1c2a1f;
  --warning:#d19a3d; --warning-soft:#332811;
  --critical:#e2645a; --critical-soft:#331f1c;
  --focus:#6ea8ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ font-weight:700; letter-spacing:-.01em; text-wrap:balance; margin:0 0 .4em; }
p{margin:0 0 .8em;}
code, .mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tabular{ font-variant-numeric:tabular-nums; }
a{ color:var(--accent); }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
.visually-hidden{ position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0); }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

/* ---------- App shell ---------- */
#app{ min-height:100vh; display:flex; flex-direction:column; }

.topbar{
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.topbar .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; white-space:nowrap; }
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); flex:none; }
.brand small{ display:block; font-weight:500; color:var(--text-muted); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; }
.topbar .spacer{ flex:1; }
.topbar .meta{ display:none; }
@media (min-width:760px){ .topbar .meta{ display:flex; gap:16px; color:var(--text-muted); font-size:12.5px; } }
.topbar .meta .mono{ color:var(--text); }

.iconbtn{
  display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px;
  border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  cursor:pointer; font-size:13px; font-weight:500;
}
.iconbtn:hover{ background:var(--surface-3); }
.iconbtn svg{ width:15px; height:15px; flex:none; }

.btn{
  border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{ background:var(--surface-3); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:7px; }

/* ---------- Layout ---------- */
.layout{ flex:1; display:grid; grid-template-columns: 250px 1fr; gap:0; align-items:start; }
@media (max-width:900px){ .layout{ grid-template-columns:1fr; } }

.rail{
  border-right:1px solid var(--border); padding:16px 12px; position:sticky; top:55px;
  align-self:start; height:calc(100vh - 55px); overflow:auto;
}
@media (max-width:900px){ .rail{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); display:flex; gap:8px; overflow-x:auto; padding:10px 12px; } }

.rail h4{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin:4px 8px 10px; }
@media (max-width:900px){ .rail h4{ display:none; } }

.step{
  display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:9px; cursor:default;
  color:var(--text-muted); margin-bottom:3px; border:1px solid transparent;
}
.step.is-clickable{ cursor:pointer; }
.step.is-clickable:hover{ background:var(--surface-2); }
.step.is-active{ background:var(--accent-soft); color:var(--text); border-color:var(--accent); }
.step .num{
  width:24px;height:24px;border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex:none; color:var(--text-muted);
}
.step.is-active .num{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.step.is-done .num{ background:var(--success); border-color:var(--success); color:#fff; }
.step .label{ flex:1; min-width:0; }
.step .label .t{ font-size:13px; font-weight:600; color:var(--text); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.step .label .s{ font-size:11px; color:var(--text-muted); }
.step .chip{ font-size:11px; font-weight:700; padding:2px 6px; border-radius:20px; background:var(--surface-2); flex:none; }

.main{ padding:22px 22px 60px; max-width:920px; }
@media (max-width:900px){ .main{ padding:16px; } }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
.card + .card{ margin-top:0; }
.eyebrow{ font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:6px; }

.pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; }
.pill-success{ background:var(--success-soft); color:var(--success); }
.pill-warning{ background:var(--warning-soft); color:var(--warning); }
.pill-critical{ background:var(--critical-soft); color:var(--critical); }
.pill-neutral{ background:var(--surface-2); color:var(--text-muted); }

/* ---------- Console ---------- */
.console{
  background:var(--console-bg); border:1px solid var(--console-border); border-radius:var(--radius);
  overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow);
}
.console-head{
  display:flex; align-items:center; gap:8px; padding:9px 14px; background:var(--console-bg-2);
  border-bottom:1px solid var(--console-border); color:var(--console-dim); font-size:11.5px;
}
.console-head .traffic{ display:flex; gap:6px; }
.console-head .traffic span{ width:9px;height:9px;border-radius:50%; background:#4d4436; display:inline-block; }
.console-log{ padding:14px; font-family:"IBM Plex Mono",monospace; font-size:13px; line-height:1.65; max-height:340px; overflow:auto; color:var(--console-info); }
.console-log .ln{ white-space:pre-wrap; word-break:break-word; margin:0 0 2px; }
.ln-sys{ color:var(--console-dim); }
.ln-cmd{ color:var(--console-fg); }
.ln-cmd::before{ content:"analyst@rangelab:~$ "; color:var(--console-dim); }
.ln-ok{ color:var(--console-ok); }
.ln-bad{ color:var(--console-bad); }
.ln-hint{ color:var(--console-dim); font-style:italic; }

.console-input{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--console-bg-2); border-top:1px solid var(--console-border); }
.console-input .prompt{ color:var(--console-fg); font-family:"IBM Plex Mono",monospace; font-size:13px; flex:none; }
.console-input input[type=text]{
  flex:1; background:transparent; border:none; color:var(--console-fg); font-family:"IBM Plex Mono",monospace; font-size:13.5px;
  padding:6px 4px; min-width:0;
}
.console-input input[type=text]:focus{ outline:none; }
.console-input input[type=text]::placeholder{ color:var(--console-dim); }
.console-input .runbtn{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; flex:none;
}
.console-input .runbtn:disabled{ opacity:.4; cursor:not-allowed; }

/* ---------- Checkpoint chrome ---------- */
.objective{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:16px; }
.objective svg{ flex:none; margin-top:2px; color:var(--accent); width:18px; height:18px; }
.objective .bloom{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; }

.cp-progress{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cp-progress .dots{ display:flex; gap:5px; }
.cp-progress .dots i{ width:16px; height:5px; border-radius:3px; background:var(--border); display:block; }
.cp-progress .dots i.done{ background:var(--success); }
.cp-progress .dots i.now{ background:var(--accent); }

.choices{ display:flex; flex-direction:column; gap:8px; margin:12px 0; }
.choice-opt{ display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:8px; cursor:pointer; background:var(--surface); }
.choice-opt:hover{ background:var(--surface-2); }
.choice-opt input{ margin-top:3px; flex:none; }
.choice-opt.correct{ border-color:var(--success); background:var(--success-soft); }
.choice-opt.incorrect{ border-color:var(--critical); background:var(--critical-soft); }

textarea, select, input[type=text].field{
  width:100%; font-family:inherit; font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text);
}
textarea{ min-height:110px; resize:vertical; }
label.field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
.wordcount{ font-size:11.5px; color:var(--text-muted); margin-top:4px; }

.hint-drawer{ margin-top:10px; }
.hint-line{ display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:8px 10px; background:var(--warning-soft); color:var(--warning); border-radius:7px; margin-top:6px; }
.actions-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

.score-tag{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; }

.finding{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.finding:last-child{ border-bottom:none; }
.finding .sev{ flex:none; margin-top:1px; }
.intel-empty{ color:var(--text-muted); font-size:13px; }

/* ---------- Debrief ---------- */
.grade-ring{ position:relative; width:132px; height:132px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
.grade-ring .val{ font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:700; }
.grade-ring .sub{ position:absolute; bottom:14px; font-size:11px; color:var(--text-muted); }
.debrief-head{ display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
.debrief-head .letter{ font-size:52px; font-weight:700; font-family:"IBM Plex Mono",monospace; line-height:1; }
table.scoretable{ width:100%; border-collapse:collapse; font-size:13px; }
table.scoretable th, table.scoretable td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
table.scoretable th{ color:var(--text-muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
table.scoretable td.num, table.scoretable th.num{ text-align:right; font-family:"IBM Plex Mono",monospace; }
.overflow-x{ overflow-x:auto; }

/* ---------- Modal ---------- */
.modal-backdrop{ position:fixed; inset:0; background:rgba(10,8,4,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:12px; max-width:560px; width:100%; max-height:85vh; overflow:auto; padding:22px; box-shadow:var(--shadow); }

/* ---------- Print ---------- */
#printSheet{ display:none; }
@media print{
  body *{ visibility:visible; }
  .topbar, .rail, .main > *:not(#printSheetWrap){ display:none !important; }
  #printSheetWrap{ display:block !important; padding:0; }
  #printSheet{ display:block !important; color:#000; font-family:"IBM Plex Mono",monospace; font-size:12px; white-space:pre-wrap; }
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><div>Rangelab Recon Console<small>MVCC &middot; Performing Active Reconnaissance</small></div></div>
    <div class="meta">
      <div>Scope&nbsp;<span class="mono">10.10.10.0/24</span></div>
      <div>Target&nbsp;<span class="mono">lab-srv01.rangelab.local</span></div>
      <div>Elapsed&nbsp;<span class="mono tabular" id="elapsedMeta">00:00</span></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="rubricBtn" title="View grading rubric">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Rubric
    </button>
    <button class="iconbtn" id="themeBtn" title="Toggle light/dark theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Light</span>
    </button>
  </div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Engagement phases"></nav>
    <main class="main" id="main"></main>
  </div>

  <div id="printSheetWrap" style="display:none;"><pre id="printSheet"></pre></div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   DATA MODEL
   ========================================================= */
var TARGET_IP = "10.10.10.15";
var TARGET_FQDN = "lab-srv01.rangelab.local";
var ATTACKER_IP = "10.10.10.42";

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

// Generic penalty helper: 15% of a checkpoint's max points, floor 1.
function penaltyFor(points){ return Math.max(1, Math.round(points*0.15)); }

var STAGES = [
  {
    key:"recon", title:"Reconnaissance", bloom:"Remember &middot; Understand &middot; Apply",
    objective:"Use native Windows and Linux commands to establish your own host configuration, then confirm reachability, path, and name resolution to the authorized target.",
    brief:[
      {t:"sys", l:"[MVCC-SOC] Engagement Ticket #RL-2026-0842 :: OPEN"},
      {t:"sys", l:"Scope ............ 10.10.10.0/24  (Rangelab isolated training VLAN)"},
      {t:"sys", l:"Target asset ..... lab-srv01.rangelab.local  (legacy application / file server)"},
      {t:"sys", l:"Authorization .... Signed Rules of Engagement on file. Analyst seat: TRAINEE-07"},
      {t:"sys", l:"Objective ........ Perform ACTIVE reconnaissance and produce a findings report."},
      {t:"sys", l:"Status ........... AWAITING ANALYST INPUT ..."}
    ],
    checkpoints:[
      { id:"r1", type:"command", points:4, prompt:"Display your own workstation's network interface configuration.",
        check:function(raw,norm){ return /^ipconfig(\s+\/all)?$/.test(norm) || /^ifconfig(\s+\S+)?$/.test(norm) || /^ip\s+(a|addr)(\s+show)?(\s+\S+)?$/.test(norm); },
        hints:["Windows and Linux each have a native command for this — no third-party tools needed.",
               "Windows: a command starting with ipconfig. Linux: ifconfig, or the newer ip utility.",
               "Try: ipconfig  (Windows)  —or—  ip a  (Linux)"],
        okOut:["Ethernet adapter:","  IPv4 Address. . . . . . . . . . . : "+ATTACKER_IP,"  Subnet Mask . . . . . . . . . . . : 255.255.255.0","  Default Gateway . . . . . . . . . : 10.10.10.1"],
        note:"Knowing your own attacking host's address matters before you touch anyone else's network — it's the first line of every packet you send.",
        finding:{label:"Attacker host identified: "+ATTACKER_IP+" (eth0/vEthernet)", sev:"info"} },
      { id:"r2", type:"command", points:4, prompt:"Confirm the target ("+TARGET_IP+") is alive and reachable over the network.",
        check:function(raw,norm){ return new RegExp("^ping(\\s+-\\S+)*\\s+"+TARGET_IP.replace(/\./g,"\\.")+"$").test(norm); },
        hints:["One word, works identically in spirit on both operating systems.",
               "Windows sends 4 echoes by default; Linux keeps going until you stop it (or you can pass a count).",
               "Try: ping "+TARGET_IP],
        okOut:["Pinging "+TARGET_IP+" with 32 bytes of data:","Reply from "+TARGET_IP+": bytes=32 time=2ms TTL=63","Reply from "+TARGET_IP+": bytes=32 time=1ms TTL=63","Reply from "+TARGET_IP+": bytes=32 time=2ms TTL=63","Reply from "+TARGET_IP+": bytes=32 time=1ms TTL=63"],
        note:"A TTL of 63 (not 64) is a small tell that at least one hop separates you from the target — worth noticing before you trust a 'flat network' assumption." },
      { id:"r3", type:"command", points:4, prompt:"Trace the hop-by-hop network path to the target.",
        check:function(raw,norm){ return new RegExp("^tracert\\s+"+TARGET_IP.replace(/\./g,"\\.")+"$").test(norm) || new RegExp("^traceroute(\\s+-\\S+)*\\s+"+TARGET_IP.replace(/\./g,"\\.")+"$").test(norm); },
        hints:["Windows spells it with an abbreviation; Linux spells it out in full.",
               "Windows: tracert. Linux: traceroute.",
               "Try: tracert "+TARGET_IP+"  (Windows)  —or—  traceroute "+TARGET_IP+"  (Linux)"],
        okOut:["Tracing route to "+TARGET_IP+" over a maximum of 30 hops:","  1    <1 ms   10.10.10.1","  2     1 ms   10.10.10.5","  3     1 ms   "+TARGET_IP+"","Trace complete."],
        note:"Path information helps you sanity-check network segmentation described in your scope document.",
        finding:{label:"Route confirmed: 2 intermediate hops to target", sev:"info"} },
      { id:"r4", type:"command", points:4, prompt:"Resolve the DNS record for the target's hostname, "+TARGET_FQDN+".",
        check:function(raw,norm){ return new RegExp("^nslookup\\s+"+TARGET_FQDN.replace(/\./g,"\\.")+"$").test(norm) || /^dig\b.*lab-srv01\.rangelab\.local/.test(norm); },
        hints:["Windows and Linux both ship a DNS lookup utility; one name is a verb, the other is three letters.",
               "Windows: nslookup. Linux: dig (or nslookup — it exists on most Linux distros too).",
               "Try: nslookup "+TARGET_FQDN+"  (Windows)  —or—  dig "+TARGET_FQDN+"  (Linux)"],
        okOut:["Server:  10.10.10.1","Address: 10.10.10.1#53","","Non-authoritative answer:","Name:    "+TARGET_FQDN,"Address: "+TARGET_IP],
        note:"Confirming forward DNS resolution ties the name in your scope document to the IP you're about to scan — the two must match before you proceed.",
        finding:{label:TARGET_FQDN+" resolves to "+TARGET_IP, sev:"info"} },
      { id:"r5", type:"command", points:4, prompt:"Before you start scanning, baseline your own machine's active connections and listening ports.",
        check:function(raw,norm){ return /^netstat\s+-\S+/.test(norm) || /^ss\s+-\S+/.test(norm); },
        hints:["This needs at least one flag — running the bare command alone won't show what you need.",
               "Windows: netstat with flags for 'all' and 'numeric'. Linux: netstat or the modern ss, with similar flags.",
               "Try: netstat -ano  (Windows)  —or—  ss -tulwn  (Linux)"],
        okOut:["Proto  Local Address          Foreign Address        State           PID","TCP    "+ATTACKER_IP+":51120     10.10.10.1:53          ESTABLISHED     2244","TCP    "+ATTACKER_IP+":3389      0.0.0.0:0              LISTENING       912"],
        note:"A pre-scan baseline of your own host is standard practice — it's what you compare against if anything on your attack box looks different afterward." }
    ]
  },
  {
    key:"scan", title:"Scanning &amp; Enumeration", bloom:"Apply &middot; Analyze",
    objective:"Use nmap (and native Windows alternatives) to enumerate open ports, service versions, and OS fingerprint on the authorized target, then interpret what those services expose.",
    brief:[
      {t:"sys", l:"[MVCC-SOC] Recon complete. lab-srv01.rangelab.local confirmed live at "+TARGET_IP+"."},
      {t:"sys", l:"Next objective: enumerate exposed services before assessing vulnerabilities."},
      {t:"sys", l:"Reminder: all scanning stays inside the signed scope, 10.10.10.0/24 only."}

/* =========================================================
   HELPERS
   ========================================================= */
function normalize(s){ return String(s||"").trim().replace(/\s+/g," ").toLowerCase(); }
function wordCount(s){ var t = String(s||"").trim(); return t? t.split(/\s+/).length : 0; }

function stageMax(stIdx){ return STAGES[stIdx].checkpoints.reduce(function(s,c){return s+c.points;},0); }
function stageEarned(stIdx){ return state.results[stIdx].reduce(function(s,r){return s+r.earned;},0); }
function stageAttempts(stIdx){ return state.results[stIdx].reduce(function(s,r){return s+r.attempts;},0); }
function stageHints(stIdx){ return state.results[stIdx].reduce(function(s,r){return s+r.hintsUsed;},0); }
function stageComplete(stIdx){ return state.results[stIdx].every(function(r){ return r.status==="correct" || r.status==="revealed" || r.status==="graded"; }); }
function totalEarned(){ return state.results.reduce(function(s,_,i){return s+stageEarned(i);},0); }

function gradeFor(pct){
  if(pct>=90) return {letter:"A", comment:"Excellent work. You moved through every phase methodically and made sound, defensible calls."};
  if(pct>=80) return {letter:"B", comment:"Solid performance with a good grasp of the methodology; a few checkpoints needed extra attempts or hints."};
  if(pct>=70) return {letter:"C", comment:"You completed the engagement but leaned on hints or repeated attempts more than expected — review command syntax before the next lab."};
  if(pct>=60) return {letter:"D", comment:"You reached the end, but several core commands and concepts need more practice before the next exercise."};
  return {letter:"F", comment:"The engagement was not completed to a passing standard — revisit the reconnaissance and scanning fundamentals and retake this simulation."};
}

function elapsedSeconds(){
  if(!state.startedAt) return 0;
  var end = state.finishedAt || Date.now();
  return Math.max(0, Math.round((end - state.startedAt)/1000));
}
function fmtTime(sec){
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

function addFinding(f){
  if(!f) return;
  if(state.findings.some(function(x){return x.label===f.label;})) return;
  state.findings.push(f);
}

function icon(name){
  var paths = {
    check:'<path d="M20 6L9 17l-5-5"/>',
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    flag:'<path d="M4 22V4"/><path d="M4 4h13l-2.5 4L17 12H4"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||"")+'</svg>';
}

function renderRail(){
  var html = '<h4>Engagement Phases</h4>';
  STAGES.forEach(function(st, i){
    var done = stageComplete(i);
    var active = (state.screen==="engagement" && i===state.stageIndex && state.viewingStage===null) || state.viewingStage===i;
    var unlocked = done || i<=state.stageIndex;
    var cls = "step" + (active?" is-active":"") + (done?" is-done":"") + (unlocked?" is-clickable":"");
    var scoreChip = done ? '<span class="chip tabular">'+stageEarned(i)+'/'+stageMax(i)+'</span>' : "";
    var numContent = done ? icon("check") : (i+1);
    html += '<div class="'+cls+'" data-goto="'+i+'" role="button" tabindex="'+(unlocked?"0":"-1")+'" aria-current="'+(active?"true":"false")+'">'+
      '<span class="num">'+numContent+'</span>'+
      '<span class="label"><span class="t">'+st.title+'</span><span class="s">'+(done?"Complete":(active?"In progress":"Locked"))+'</span></span>'+
      scoreChip+
      '</div>';
  });
  html += '<div class="step'+(state.screen==="debrief"?" is-active":"")+(state.screen==="debrief"||STAGES.every(function(_,i){return stageComplete(i);})?" is-clickable":"")+'" data-goto="debrief">'+
    '<span class="num">'+icon("flag")+'</span><span class="label"><span class="t">Debrief &amp; Grade</span><span class="s">Summary report</span></span></div>';
  rail.innerHTML = html;

  rail.querySelectorAll("[data-goto]").forEach(function(el){
    el.addEventListener("click", function(){
      var v = el.getAttribute("data-goto");
      if(v==="debrief"){
        if(STAGES.every(function(_,i){return stageComplete(i);})){ goDebrief(); }
        return;
      }
      var idx = parseInt(v,10);
      if(idx<=state.stageIndex || stageComplete(idx)){
        state.viewingStage = (idx===state.stageIndex) ? null : idx;
        state.screen = "engagement";
        render();
      }
    });
  });
}

function render(){
  renderRail();
  if(state.screen==="intro") renderIntro();
  else if(state.screen==="engagement") renderEngagement();
  else if(state.screen==="debrief") renderDebrief();
  updatePrintSheet();
  updateMeta();
}

function updateMeta(){
  elapsedMeta.textContent = fmtTime(elapsedSeconds());
}

function renderEngagement(){
  var idx = state.viewingStage!==null ? state.viewingStage : state.stageIndex;
  var stage = STAGES[idx];
  var reviewing = state.viewingStage!==null;
  var results = state.results[idx];

  var html = "";

  html += '<div class="card">'+
    '<div class="eyebrow">Phase '+(idx+1)+' of '+STAGES.length+' &middot; '+(reviewing?"Review":"Live")+'</div>'+
    '<h2>'+stage.title+'</h2>'+
    '<div class="objective"><div>'+icon("flag")+'</div><div><div class="bloom">'+stage.bloom+'</div>'+stage.objective+'</div></div>'+
  '</div>';

  html += '<div class="console"><div class="console-head"><span class="traffic"><span></span><span></span><span></span></span>analyst@rangelab &mdash; '+stage.key+'</div><div class="console-log" id="consoleLog" aria-live="polite">';
  stage.brief.forEach(function(b){ html += '<div class="ln ln-sys">'+esc(b.l)+'</div>'; });

  // Replay resolved checkpoints as transcript
  results.forEach(function(r, i){
    var cp = stage.checkpoints[i];
    if(r.status==="pending") return;
    if(cp.type==="command"){
      html += '<div class="ln ln-cmd">'+esc(r.lastInput||"")+'</div>';
    }
    if(r.status==="revealed"){
      html += '<div class="ln ln-hint">answer revealed &mdash; 0 pts</div>';
    }
    (cp.okOut||[]).forEach(function(l){ html += '<div class="ln ln-ok">'+esc(l)+'</div>'; });
    if(cp.type==="text" || cp.type==="multi" || cp.type==="choice"){
      html += '<div class="ln ln-ok">[checkpoint graded: '+r.earned+'/'+cp.points+' pts]</div>';
    }
  });
  html += '</div></div>';

  // Findings intel panel
  html += renderIntel();

  // Gate (stage 4 authorization) — must accept before checkpoints unlock
  var gateOk = !stage.gate || state.gateAccepted[idx];
  if(stage.gate && !reviewing){
    html += '<div class="card" id="gateCard">'+
      '<div class="eyebrow">Authorization Gate</div>'+
      '<label style="display:flex; gap:10px; align-items:flex-start; cursor:pointer;">'+
      '<input type="checkbox" id="gateCheck" style="margin-top:3px;" '+(gateOk?"checked disabled":"")+'>'+
      '<span>'+esc(stage.gate.prompt)+'</span></label>'+
      (gateOk?'<div class="pill pill-success" style="margin-top:10px;">Authorization confirmed</div>':'<div class="actions-row"><button class="btn btn-primary" id="gateBtn" disabled>Confirm &amp; unlock exploitation</button></div>')+
      '</div>';
  }

  // Current / reviewed checkpoint
  var cpIndex = reviewing ? null : firstUnresolved(idx);
  if(reviewing){
    stage.checkpoints.forEach(function(cp, i){ html += renderCheckpoint(stage, idx, cp, i, results[i], true); });
  } else if(gateOk){
    if(cpIndex===null){
      html += '<div class="card"><div class="pill pill-success">Phase complete &mdash; '+stageEarned(idx)+' / '+stageMax(idx)+' pts</div>'+
        '<div class="actions-row" style="margin-top:14px;"><button class="btn btn-primary" id="nextStageBtn">'+(idx===STAGES.length-1?"Proceed to Debrief":"Continue to next phase")+'</button></div></div>';
    } else {
      html += renderCheckpoint(stage, idx, stage.checkpoints[cpIndex], cpIndex, results[cpIndex], false);
    }
  } else {
    html += '<div class="card"><p class="intel-empty">Confirm authorization above to unlock this phase\'s checkpoints.</p></div>';
  }

  if(reviewing){
    html += '<div class="actions-row"><button class="btn" id="backToLiveBtn">Return to current phase</button></div>';
  }

  root.innerHTML = html;

  var log = document.getElementById("consoleLog");
  if(log) log.scrollTop = log.scrollHeight;

  var backBtn = document.getElementById("backToLiveBtn");
  if(backBtn) backBtn.addEventListener("click", function(){ state.viewingStage=null; render(); });

  var nextBtn = document.getElementById("nextStageBtn");
  if(nextBtn) nextBtn.addEventListener("click", function(){
    if(idx===STAGES.length-1){ goDebrief(); }
    else { state.stageIndex = idx+1; state.cpIndex = 0; render(); }
  });

  var gateCheck = document.getElementById("gateCheck");
  var gateBtn = document.getElementById("gateBtn");
  if(gateCheck && gateBtn){
    gateCheck.addEventListener("change", function(){ gateBtn.disabled = !gateCheck.checked; });
    gateBtn.addEventListener("click", function(){
      state.gateAccepted[idx] = true;
      state.log = state.log || [];
      render();
    });
  }

  wireCheckpointHandlers(stage, idx, reviewing || !gateOk);
}

function firstUnresolved(stIdx){
  var results = state.results[stIdx];
  for(var i=0;i<results.length;i++){
    if(results[i].status==="pending") return i;
  }
  return null;
}

function renderIntel(){
  var body = state.findings.length ? state.findings.map(function(f){
    var pillClass = f.sev==="critical"?"pill-critical":(f.sev==="warn"?"pill-warning":"pill-neutral");
    var sevLabel = f.sev==="critical"?"CRITICAL":(f.sev==="warn"?"WARN":"INFO");
    return '<div class="finding"><span class="sev pill '+pillClass+'">'+sevLabel+'</span><span>'+esc(f.label)+'</span></div>';
  }).join("") : '<p class="intel-empty">No findings logged yet. Findings appear here automatically as you complete checkpoints.</p>';
  return '<div class="card"><div class="eyebrow">Live Findings &amp; Asset Board</div>'+body+'</div>';
}

function renderCheckpoint(stage, stIdx, cp, cpIdx, r, readOnly){
  var dots = stage.checkpoints.map(function(_,i){
    var st = state.results[stIdx][i];
    var cls = (st.status!=="pending") ? "done" : (i===cpIdx ? "now" : "");
    return '<i class="'+cls+'"></i>';
  }).join("");

  var resolved = r.status!=="pending";
  var html = '<div class="card" data-cp="'+cp.id+'">'+
    '<div class="cp-progress"><span class="eyebrow" style="margin:0;">Checkpoint '+(cpIdx+1)+' of '+stage.checkpoints.length+' &middot; '+cp.points+' pts</span><span class="dots">'+dots+'</span></div>'+
    '<p style="font-size:15px; font-weight:600; margin-bottom:10px;">'+esc(cp.prompt)+'</p>';

  if(resolved){
    var pillCls = r.status==="revealed" ? "pill-warning" : (r.earned===r.possible ? "pill-success" : "pill-warning");
    var label = r.status==="revealed" ? "Answer revealed" : "Resolved";
    html += '<div class="pill '+pillCls+'">'+label+' &mdash; <span class="tabular">'+r.earned+'</span>/'+cp.points+' pts'+(r.attempts?(' &middot; '+r.attempts+' attempt'+(r.attempts>1?"s":"")):"")+(r.hintsUsed?(' &middot; '+r.hintsUsed+' hint'+(r.hintsUsed>1?"s":"")):"")+'</div>';
    if(cp.note) html += '<p style="margin-top:10px; color:var(--text-muted); font-size:13.5px;"><strong>Why it matters:</strong> '+esc(cp.note)+'</p>';
    html += '</div>';
    return html;
  }

  if(readOnly){
    html += '<p class="intel-empty">Not reached yet.</p></div>';
    return html;
  }

  // Input surface by type
  if(cp.type==="command"){
    html += '<div class="console" style="margin-bottom:0;">'+
      '<div class="console-input"><span class="prompt">$</span><input type="text" id="cmdInput" autocomplete="off" spellcheck="false" placeholder="type a command...">'+
      '<button class="runbtn" id="runBtn">Run</button></div></div>';
  } else if(cp.type==="choice"){
    html += '<div class="choices" id="choiceWrap">'+cp.options.map(function(o,i){
      return '<label class="choice-opt"><input type="radio" name="cp_choice" value="'+i+'"><span>'+esc(o)+'</span></label>';
    }).join("")+'</div><div class="actions-row"><button class="btn btn-primary" id="submitBtn">Submit answer</button></div>';
  } else if(cp.type==="multi"){
    html += '<div class="choices" id="choiceWrap">'+cp.options.map(function(o,i){
      return '<label class="choice-opt"><input type="checkbox" name="cp_multi" value="'+i+'"><span>'+esc(o)+'</span></label>';
    }).join("")+'</div><div class="actions-row"><button class="btn btn-primary" id="submitBtn">Submit selections</button></div>';
  } else if(cp.type==="text"){
    html += '<label class="field-label" for="textInput">Your response</label><textarea id="textInput" placeholder="Write your answer here..."></textarea>'+
      '<div class="wordcount"><span id="wcLabel">0</span> words &middot; minimum '+cp.minWords+'</div>'+
      '<div class="actions-row"><button class="btn btn-primary" id="submitBtn">Submit response</button></div>';
  }

  html += '<div class="hint-drawer" id="hintDrawer"></div>'+
    '<div class="actions-row">'+
      '<button class="btn btn-sm" id="hintBtn">Get a hint ('+"-"+penaltyFor(cp.points)+' pt)</button>'+
      '<button class="btn btn-sm btn-ghost" id="revealBtn">Reveal answer (0 pts)</button>'+
    '</div>'+
  '</div>';
  return html;
}

function wireCheckpointHandlers(stage, stIdx, reviewing){
  if(reviewing) return;
  var cpIdx = firstUnresolved(stIdx);
  if(cpIdx===null) return;
  var cp = stage.checkpoints[cpIdx];
  var r = state.results[stIdx][cpIdx];

  var hintBtn = document.getElementById("hintBtn");
  var revealBtn = document.getElementById("revealBtn");
  var hintDrawer = document.getElementById("hintDrawer");

  function refreshHintUI(){
    if(!hintDrawer) return;
    hintDrawer.innerHTML = "";
    for(var i=0;i<r.hintsUsed;i++){
      hintDrawer.innerHTML += '<div class="hint-line">'+icon("flag")+'<span>'+esc(cp.hints[i])+'</span></div>';
    }
    if(hintBtn) hintBtn.disabled = r.hintsUsed>=cp.hints.length-1; // last hint reserved as "reveal"
  }
  refreshHintUI();

  if(hintBtn) hintBtn.addEventListener("click", function(){
    if(r.hintsUsed < cp.hints.length-1){
      r.hintsUsed++;
      r.possible = Math.max(0, r.possible - penaltyFor(cp.points));
      refreshHintUI();
    }
  });

  if(revealBtn) revealBtn.addEventListener("click", function(){
    r.status = "revealed";
    r.earned = 0;
    r.possible = 0;
    r.revealed = true;
    if(cp.type==="command"){ r.lastInput = "(answer revealed)"; }
    if(cp.finding) addFinding(cp.finding);
    render();
  });

  if(cp.type==="command"){
    var input = document.getElementById("cmdInput");
    var runBtn = document.getElementById("runBtn");
    function submitCommand(){
      var raw = input.value;
      var norm = normalize(raw);
      if(!norm) return;
      r.attempts++;
      r.lastInput = raw;
      var ok = false;
      try{ ok = cp.check(raw, norm, raw); }catch(e){ ok = false; }
      if(ok){
        r.status="correct"; r.earned = r.possible;
        if(cp.finding) addFinding(cp.finding);
      } else {
        r.possible = Math.max(0, r.possible - penaltyFor(cp.points));
        flashBad();
      }
      render();
    }
    runBtn.addEventListener("click", submitCommand);
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") submitCommand(); });
    input.focus();
  }

  if(cp.type==="choice"){
    var submitBtn = document.getElementById("submitBtn");
    submitBtn.addEventListener("click", function(){
      var checked = document.querySelector('input[name="cp_choice"]:checked');
      if(!checked) return;
      r.attempts++;
      var val = parseInt(checked.value,10);
      if(val===cp.correct){
        r.status="correct"; r.earned = r.possible;
        if(cp.finding) addFinding(cp.finding);
      } else {
        r.possible = Math.max(0, r.possible - penaltyFor(cp.points));
        flashBad();
      }
      render();
    });
  }

  if(cp.type==="multi"){
    var submitBtn2 = document.getElementById("submitBtn");
    submitBtn2.addEventListener("click", function(){
      var checks = Array.prototype.slice.call(document.querySelectorAll('input[name="cp_multi"]:checked'));
      var chosen = checks.map(function(c){ return parseInt(c.value,10); });
      r.attempts++;
      var correctSet = cp.correctSet;
      var matched = chosen.filter(function(v){ return correctSet.indexOf(v)>-1; }).length;
      var wrong = chosen.filter(function(v){ return correctSet.indexOf(v)===-1; }).length;
      var ratio = Math.max(0, (matched - wrong) / correctSet.length);
      r.status="graded";
      r.earned = Math.round(r.possible * Math.min(1,ratio));
      if(cp.finding) addFinding(cp.finding);
      render();
    });
  }

  if(cp.type==="text"){
    var textInput = document.getElementById("textInput");
    var wcLabel = document.getElementById("wcLabel");
    textInput.addEventListener("input", function(){ wcLabel.textContent = wordCount(textInput.value); });
    var submitBtn3 = document.getElementById("submitBtn");
    submitBtn3.addEventListener("click", function(){
      var val = textInput.value;
      r.attempts++;
      var wc = wordCount(val);
      var lower = val.toLowerCase();
      var matches = cp.keywords.filter(function(k){ return lower.indexOf(k)>-1; }).length;
      var lengthOk = wc >= cp.minWords;
      var ratio = lengthOk ? Math.min(1, matches / cp.minMatches) : Math.min(0.5, matches / (cp.minMatches*2));
      r.status="graded";
      r.earned = Math.round(r.possible * ratio);
      r.lastInput = val;
      if(cp.finding) addFinding(cp.finding);
      render();
    });
  }
}

function flashBad(){
  var log = document.getElementById("consoleLog");
  if(!log) return;
  var d = document.createElement("div");
  d.className = "ln ln-bad";
  d.textContent = "Not recognized / incorrect — try again, or use a hint.";
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

/* =========================================================
   RENDER: DEBRIEF
   ========================================================= */
function goDebrief(){
  state.screen = "debrief";
  state.viewingStage = null;
  if(!state.finishedAt) state.finishedAt = Date.now();
  stopTimer();
  render();
}

function renderDebrief(){
  var total = totalEarned();
  var pct = TOTAL_POSSIBLE ? Math.round((total/TOTAL_POSSIBLE)*100) : 0;
  var g = gradeFor(pct);
  var ringColor = pct>=80?"var(--success)":(pct>=60?"var(--warning)":"var(--critical)");

  var rows = STAGES.map(function(st,i){
    return '<tr><td>'+st.title+'</td><td class="num tabular">'+stageEarned(i)+'/'+stageMax(i)+'</td>'+
      '<td class="num tabular">'+stageAttempts(i)+'</td><td class="num tabular">'+stageHints(i)+'</td></tr>';
  }).join("");

  var findingsHtml = state.findings.length ? state.findings.map(function(f){
    var pillClass = f.sev==="critical"?"pill-critical":(f.sev==="warn"?"pill-warning":"pill-neutral");
    return '<div class="finding"><span class="sev pill '+pillClass+'">'+ (f.sev||"info").toUpperCase() +'</span><span>'+esc(f.label)+'</span></div>';
  }).join("") : '<p class="intel-empty">No findings logged.</p>';

  root.innerHTML =
  '<div class="card">'+
    '<div class="eyebrow">Engagement Debrief</div>'+
    '<div class="debrief-head">'+
      '<div class="grade-ring" style="background:conic-gradient('+ringColor+' '+(pct*3.6)+'deg, var(--surface-2) 0deg);"><div class="letter" style="color:'+ringColor+'">'+g.letter+'</div></div>'+
      '<div style="flex:1; min-width:220px;">'+
        '<h2 style="margin-bottom:4px;">'+ (state.studentName? esc(state.studentName): "Trainee") +'</h2>'+
        '<div class="tabular" style="font-size:15px; color:var(--text-muted);">Score: <strong style="color:var(--text);">'+total+' / '+TOTAL_POSSIBLE+'</strong> ('+pct+'%) &middot; Time: <strong class="tabular" style="color:var(--text);">'+fmtTime(elapsedSeconds())+'</strong></div>'+
        '<p style="margin-top:10px;">'+esc(g.comment)+'</p>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="card"><div class="eyebrow">Score Breakdown</div><div class="overflow-x"><table class="scoretable"><thead><tr><th>Phase</th><th class="num">Points</th><th class="num">Attempts</th><th class="num">Hints</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="card"><div class="eyebrow">Findings Log</div>'+findingsHtml+'</div>'+
  '<div class="card"><div class="eyebrow">Actions</div>'+
    '<div class="actions-row">'+
      '<button class="btn btn-primary" id="printBtn">Print summary</button>'+
      '<button class="btn" id="saveBtn">Save summary (.txt)</button>'+
      '<button class="btn btn-ghost" id="restartBtn">Start a new attempt</button>'+
    '</div>'+
  '</div>';

  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
  document.getElementById("saveBtn").addEventListener("click", downloadSummary);
  document.getElementById("restartBtn").addEventListener("click", openResetModal);
}

/* =========================================================
   RUBRIC / RESET MODALS
   ========================================================= */
function openModal(innerHtml){
  var back = document.createElement("div");
  back.className = "modal-backdrop";
  back.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+innerHtml+'</div>';
  document.body.appendChild(back);
  back.addEventListener("click", function(e){ if(e.target===back) back.remove(); });
  return back;
}

function openRubric(){
  var rows = STAGES.map(function(st,i){
    return '<tr><td>'+(i+1)+'. '+st.title+'</td><td class="num tabular">'+stageMax(i)+' pts</td><td>'+st.bloom+'</td></tr>';
  }).join("");
  openModal(
    '<h3>Grading Rubric</h3>'+
    '<p style="font-size:13.5px; color:var(--text-muted);">100 points total across five phases. Each checkpoint starts at full value; a wrong attempt or a hint each cost roughly 15% of that checkpoint\'s points (minimum 1 pt), floored at zero. Revealing an answer scores 0 for that checkpoint but lets you continue. Free-response checkpoints are graded on required keywords and minimum length rather than exact wording.</p>'+
    '<div class="overflow-x"><table class="scoretable"><thead><tr><th>Phase</th><th class="num">Max points</th><th>Bloom focus</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p style="margin-top:12px; font-size:13.5px;"><strong>Letter scale:</strong> A 90&ndash;100 &middot; B 80&ndash;89 &middot; C 70&ndash;79 &middot; D 60&ndash;69 &middot; F below 60.</p>'+
    '<div class="actions-row"><button class="btn btn-primary" id="closeRubric">Close</button></div>'
  );
  document.getElementById("closeRubric").addEventListener("click", function(){ document.querySelector(".modal-backdrop").remove(); });
}

function openResetModal(){
  var back = openModal(
    '<h3>Start a new attempt?</h3>'+
    '<p>This clears all scores, findings, and console history for this session. This cannot be undone.</p>'+
    '<div class="actions-row"><button class="btn" id="cancelReset">Cancel</button><button class="btn btn-primary" id="confirmReset">Reset engagement</button></div>'
  );
  document.getElementById("cancelReset").addEventListener("click", function(){ back.remove(); });
  document.getElementById("confirmReset").addEventListener("click", function(){
    back.remove();
    resetState();
  });
}

function resetState(){
  stopTimer();
  state.screen = "intro";
  state.stageIndex = 0;
  state.cpIndex = 0;
  state.gateAccepted = [];
  state.results = STAGES.map(function(st){
    return st.checkpoints.map(function(c){ return { status:"pending", earned:0, possible:c.points, attempts:0, hintsUsed:0, revealed:false }; });
  });
  state.findings = [];
  state.startedAt = null;
  state.finishedAt = null;
  state.viewingStage = null;
  render();
}

/* =========================================================
   THEME
   ========================================================= */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
  document.getElementById("themeLabel").textContent = state.theme==="dark" ? "Dark" : "Light";
  document.getElementById("themeIcon").innerHTML = state.theme==="dark"
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
document.getElementById("themeBtn").addEventListener("click", function(){
  state.theme = state.theme==="dark" ? "light" : "dark";
  applyTheme();
});
document.getElementById("rubricBtn").addEventListener("click", openRubric);

/* =========================================================
   TIMER
   ========================================================= */
function startTimer(){
  stopTimer();
  timerHandle = setInterval(updateMeta, 1000);
}
function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

/* =========================================================
   PRINT SHEET + SAVE FILE
   ========================================================= */
function buildSummaryText(){
  var total = totalEarned();
  var pct = TOTAL_POSSIBLE ? Math.round((total/TOTAL_POSSIBLE)*100) : 0;
  var g = gradeFor(pct);
  var lines = [];
  lines.push("RANGELAB RECON CONSOLE — ENGAGEMENT SUMMARY");
  lines.push("Course: Performing Active Reconnaissance (MVCC)");
  lines.push("Student: " + (state.studentName || "Trainee"));
  lines.push("Generated: " + new Date().toString());
  lines.push("Target scope: 10.10.10.0/24  |  Asset: " + TARGET_FQDN);
  lines.push("");
  lines.push("OVERALL SCORE: " + total + " / " + TOTAL_POSSIBLE + "  (" + pct + "%)   GRADE: " + g.letter);
  lines.push("TIME ON TASK: " + fmtTime(elapsedSeconds()));
  lines.push(g.comment);
  lines.push("");
  lines.push("PHASE BREAKDOWN");
  lines.push("----------------");
  STAGES.forEach(function(st,i){
    lines.push((i+1)+". "+st.title+": "+stageEarned(i)+"/"+stageMax(i)+" pts  |  attempts: "+stageAttempts(i)+"  |  hints used: "+stageHints(i)+"  |  status: "+(stageComplete(i)?"complete":"in progress"));
  });
  lines.push("");
  lines.push("FINDINGS LOG");
  lines.push("------------");
  if(state.findings.length){
    state.findings.forEach(function(f){ lines.push("["+(f.sev||"info").toUpperCase()+"] "+f.label); });
  } else {
    lines.push("(none logged)");
  }
  lines.push("");
  lines.push("This is an educational simulation generated for a training exercise. No real systems were scanned or accessed.");
  return lines.join("\n");
}

function updatePrintSheet(){
  var el = document.getElementById("printSheet");
  if(el) el.textContent = buildSummaryText();
}

function downloadSummary(){
  var text = buildSummaryText();
  var blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = new Date().toISOString().slice(0,10);
  var namePart = (state.studentName||"trainee").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "trainee";
  a.href = url;
  a.download = "active-recon-summary_"+namePart+"_"+stamp+".txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
}

/* =========================================================
   INIT
   ========================================================= */
applyTheme();
render();

})();
</script>
