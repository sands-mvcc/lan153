<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Review Week: Access Control Matrix Learning Activity</title>
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E8EEF6; --ink:#13213C; --muted:#56657F; --rule:#D3DCE8;
  --navy:#0047AB; --on-navy:#FFFFFF; --green:#00875A; --green-soft:#DDF3E8; --bad:#B42318; --bad-soft:#FDE7E5; --warn:#9A4A00;
  --pA-bg:#FBE3EE; --pA:#A3134F; --pW-bg:#FFEBD6; --pW:#A84B00; --pR-bg:#DDF3E8; --pR:#0B6B45; --pD-bg:#FFFFFF; --pD:#A3AEC0;
  --xh:rgba(0,71,171,.08); --shadow:0 12px 32px rgba(10,20,40,.18);
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0D1524; --surface:#152038; --sunk:#1C2A47; --ink:#E5ECF6; --muted:#9DABC2; --rule:#2B3B5C;
  --navy:#7EA6FF; --on-navy:#0D1524; --green:#3DDBA2; --green-soft:#0F3B2A; --bad:#FF8A80; --bad-soft:#4A1A1A; --warn:#FFB86B;
  --pA-bg:#4A1530; --pA:#FF9CC6; --pW-bg:#4A2A0E; --pW:#FFC08A; --pR-bg:#0F3B2A; --pR:#7CE3B5; --pD-bg:#152038; --pD:#5D6D88;
  --xh:rgba(126,166,255,.13); --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.55 var(--sans);background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2}
p{max-width:68ch}

/* Header and step rail */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px}
.brand h1{font-size:20px}
.brand span{display:block;font-size:13px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.meter{font-size:14px;color:var(--muted);margin-right:6px}
.meter b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.steps{max-width:1440px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 20px 12px}
.step{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.step:hover{border-color:var(--navy);color:var(--ink)}
.step.cur{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.step i{width:8px;height:8px;border-radius:50%;background:var(--rule);font-style:normal}
.step i.part{background:var(--warn)} .step i.done{background:var(--green)}
.step.cur i{outline:2px solid var(--on-navy)}

/* Buttons */
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
[data-theme="dark"] .btn.danger{color:#2A0A08}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.on{background:var(--sunk);border-color:var(--navy)}

/* Layout */
.app{max-width:1440px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px}
.work{position:sticky;top:112px}
@media (max-width:980px){.grid{grid-template-columns:1fr}.work{position:static}}

/* Mission panel */
.mhead{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:14px}
.mnum{font-size:14px;color:var(--muted)}
.mhead h2{font-size:26px;margin:2px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tags span.k{border-color:var(--navy);color:var(--navy)}
.scen{background:var(--sunk);border-left:4px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 14px;margin:12px 0;font-size:15px}
.mpanel h3{font-size:17px;margin:18px 0 8px}
.tasks{list-style:none;display:grid;gap:8px}
.tasks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.tasks li::before{content:"";width:16px;height:16px;margin-top:3px;border:2px solid var(--rule);border-radius:50%}
.tasks li.ok::before{background:var(--green);border-color:var(--green)}
.tasks li.now{font-weight:600}
.tasks li.now::before{border-color:var(--navy)}
.tasks small{display:block;color:var(--muted);font-weight:400}
.note{font-size:14px;color:var(--muted)}
.notes{list-style:none;display:grid;gap:8px;font-size:14.5px}
.notes li{padding:8px 10px;border:1px solid var(--rule);border-radius:6px}
.form{display:grid;gap:10px;margin-top:8px}
.form label,.pop label{display:grid;gap:4px;font-size:14px;font-weight:600}
input[type=text],input[type=date],select,textarea{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 10px;font-weight:400;font-size:15px}
textarea{min-height:64px;resize:vertical}
.jd{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.jd b{font-family:var(--serif);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{font-size:13px;background:var(--green-soft);border-radius:4px;padding:2px 8px}
.seg2{display:flex;gap:6px;margin:6px 0}

/* Questions */
.q{border:0;margin:14px 0}
.q legend{font-weight:600;font-size:15px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:14.5px;cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt.on{border-color:var(--navy);background:var(--sunk);box-shadow:inset 3px 0 0 var(--navy)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.exp{font-size:14px;color:var(--muted);margin-top:4px}

/* Results */
.checkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.res{margin-top:14px;border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.res h4{font-family:var(--serif);font-size:17px;margin-bottom:6px}
.res ul{list-style:none;display:grid;gap:6px;font-size:14.5px}
.res li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.res li b{font-weight:700}
.res .y{color:var(--green)} .res .n{color:var(--bad)}
.res small{display:block;color:var(--muted)}

/* Workspace */
.wtool{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mode{font-size:14px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--sunk)}
.mode[data-m="edit"]{box-shadow:inset 3px 0 0 var(--pW)}
.mode[data-m="flag"]{box-shadow:inset 3px 0 0 var(--bad)}
.mode[data-m="find"],.mode[data-m="select"]{box-shadow:inset 3px 0 0 var(--navy)}
.readout{font-size:14px;color:var(--muted);min-height:22px;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-grid;place-items:center;width:22px;height:20px;border-radius:3px;font-style:normal;font-weight:700;font-size:12px;border:1px solid var(--rule)}
.scroll{overflow:auto;max-height:calc(100vh - 300px);min-height:300px;border:1px solid var(--rule);border-radius:8px}
@media (max-width:980px){.scroll{max-height:70vh}}

table.acm{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.acm th,.acm td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.acm thead th{position:sticky;top:0;z-index:4;background:var(--surface);font-size:12px;font-weight:700;padding:8px 4px;min-width:44px;color:var(--muted)}
.acm thead th abbr{text-decoration:none}
.acm thead th.corner{left:0;z-index:6;text-align:left;padding-left:12px;font-family:var(--serif);font-size:14px;color:var(--ink)}
.acm tbody th{position:sticky;left:0;z-index:3;background:var(--surface);min-width:200px;padding:0;text-align:left}
.acm thead th.xh{color:var(--navy);background:var(--sunk)}
.rowbtn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:5px 12px;cursor:default}
.edit .rowbtn{cursor:pointer}
.edit .rowbtn:hover .nm{text-decoration:underline}
.rowbtn .nm{display:block;font-weight:600;font-size:14px}
.rowbtn .rl{display:block;font-size:12px;color:var(--muted)}
tr.xr th{background:var(--sunk)}
.acm td{padding:0}
.cell{position:relative;display:block;width:100%;height:42px;border:0;font-weight:700;font-size:13px;cursor:pointer;background:var(--pD-bg);color:var(--pD)}
.cell.pA{background:var(--pA-bg);color:var(--pA)}
.cell.pW{background:var(--pW-bg);color:var(--pW)}
.cell.pR{background:var(--pR-bg);color:var(--pR)}
.view .cell{cursor:default}
td.xh .cell,tr.xr .cell{box-shadow:inset 0 0 0 999px var(--xh)}
.cell:hover,.cell:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;z-index:2}
.cell.sel{outline:3px solid var(--green);outline-offset:-3px}
.cell.found{outline:3px solid var(--navy);outline-offset:-3px}
.cell.tmp::after{content:"";position:absolute;left:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--navy)}
.cell.flg::before{content:attr(data-f);position:absolute;top:1px;right:2px;font-size:9px;line-height:1;padding:2px 3px;border-radius:3px;background:var(--bad);color:#fff}
[data-theme="dark"] .cell.flg::before{color:#2A0A08}
tr.off .cell{opacity:.4}
tr.off .nm{text-decoration:line-through}
tr.new th{box-shadow:inset 3px 0 0 var(--green)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
details.more{margin-top:10px;font-size:14px}
details.more summary{cursor:pointer;font-weight:600}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 14px;margin-top:6px;color:var(--muted)}
.key b{color:var(--ink);display:inline-block;min-width:42px}
.logl{list-style:none;max-height:220px;overflow:auto;margin-top:6px;display:grid;gap:4px}
.logl li{border-left:3px solid var(--navy);padding:4px 8px;background:var(--sunk);border-radius:0 4px 4px 0}
.logl small{color:var(--muted);display:block}

/* ACME workspace */
.assets{list-style:none;display:grid;gap:6px}
.assets li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:6px}
.assets li b{font-size:14.5px}
.assets li small{display:block;color:var(--muted);font-size:13px}
.segc{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.segc button{border:0;border-right:1px solid var(--rule);background:var(--surface);padding:6px 9px;font-size:12.5px;font-weight:700;cursor:pointer}
.segc button:last-child{border-right:0}
.segc button.on{background:var(--navy);color:var(--on-navy)}
@media (max-width:560px){.assets li{grid-template-columns:1fr}}
.zone{border-collapse:separate;border-spacing:0;margin-top:8px}
.zone th,.zone td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0}
.zone thead th{font-size:12.5px;padding:8px 10px;color:var(--muted)}
.zone tbody th{text-align:left;padding:6px 12px;font-size:14px;min-width:190px}
.zone .cell{width:72px}
.wsec+.wsec{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.wsec h3{font-size:19px}

/* Briefing */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;padding:28px}
.hero h2{font-size:clamp(32px,5vw,52px);letter-spacing:-.01em}
.hero p.lead{font-family:var(--serif);font-size:19px;line-height:1.6;margin:12px 0 18px}
.mini{border-collapse:separate;border-spacing:3px;font-weight:700;font-size:13px}
.mini td,.mini th{width:38px;height:32px;text-align:center;border-radius:4px}
.mini th{font-size:11px;color:var(--muted);font-weight:600}
.mini th.r{text-align:right;width:auto;padding-right:6px;white-space:nowrap}
.mini .pA{background:var(--pA-bg);color:var(--pA)} .mini .pW{background:var(--pW-bg);color:var(--pW)}
.mini .pR{background:var(--pR-bg);color:var(--pR)} .mini .pD{background:var(--sunk);color:var(--pD)}
.mini .hit{outline:3px solid var(--navy);outline-offset:-3px}
.mini th.hl{color:var(--navy)}
.cap{font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:19px;margin-bottom:8px}
.ksal{list-style:none;display:grid;gap:8px;font-size:14.5px}
.ksal li{display:grid;grid-template-columns:34px 1fr;gap:6px}
.ksal b{color:var(--navy)}
.how{margin-top:20px}
.how ol{margin:8px 0 0 20px;display:grid;gap:6px;max-width:80ch}

/* Pop-over */
#pop{position:fixed;z-index:60;width:min(330px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:16px}
#pop h4{font-family:var(--serif);font-size:17px;margin-bottom:2px}
#pop .cur{font-size:13px;color:var(--muted);margin-bottom:10px}
#pop .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
#pop .seg button{border:1px solid var(--rule);border-radius:6px;padding:7px 0;font-weight:700;font-size:13px;cursor:pointer;background:var(--surface)}
#pop .seg button.on{outline:3px solid var(--navy);outline-offset:-1px}
#pop .seg .pA{background:var(--pA-bg);color:var(--pA)} #pop .seg .pW{background:var(--pW-bg);color:var(--pW)} #pop .seg .pR{background:var(--pR-bg);color:var(--pR)}
#pop label{margin-bottom:8px}
#pop .act{display:flex;gap:8px;margin-top:6px}
#pop .err{color:var(--bad);font-size:13px;margin-top:6px}
#pop .stack{display:grid;gap:6px}
#pop .stack button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px}
#pop .stack button span{display:block;font-size:12.5px;color:var(--muted)}
#pop .stack button.on{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
@media (max-width:640px){#pop{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto}}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;max-width:min(560px,calc(100vw - 24px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.ok{border-left:5px solid var(--green)} #toast.warn{border-left:5px solid var(--warn)}

/* Summary */
.sumgrid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.sumgrid{grid-template-columns:1fr}}
.sumctl{display:grid;gap:12px}
.sumctl .btn{width:100%}

/* Report (also used for the downloaded file and printing) */
.rp{font:14px/1.5 var(--sans);color:var(--ink)}
.rp h2{font-family:var(--serif);font-size:26px}
.rp h3{font-family:var(--serif);font-size:18px;margin:20px 0 6px;border-bottom:2px solid var(--navy);padding-bottom:3px}
.rp .meta{color:var(--muted)}
.rp .big{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0}
.rp .big div{font-size:13px;color:var(--muted)}
.rp .big b{display:block;font-family:var(--serif);font-size:30px;color:var(--ink)}
.rp table{border-collapse:collapse;width:100%;margin-top:4px}
.rp th,.rp td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.rp th{background:var(--sunk);font-size:13px}
.rp .bar2{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;min-width:120px}
.rp .bar2 i{display:block;height:100%;background:var(--green)}
.rp .mx td,.rp .mx th{padding:2px 4px;text-align:center;font-size:11.5px}
.rp .mx td.nm{text-align:left;white-space:nowrap}
.rp .stmt{border-left:4px solid var(--navy);padding:8px 12px;background:var(--sunk);white-space:pre-wrap}
.rp .ok{color:var(--green);font-weight:700} .rp .no{color:var(--bad);font-weight:700}
.rpwrap{overflow-x:auto}

@media print{
  :root,[data-theme="dark"]{--bg:#fff;--surface:#fff;--sunk:#EEF2F7;--ink:#000;--muted:#444;--rule:#BBB;--navy:#0047AB;--green:#00875A;--bad:#B42318}
  body{background:#fff}
  .top,.sumctl,#toast,#pop,.noprint{display:none!important}
  .app{padding:0;max-width:none}
  .sumgrid{display:block}
  .panel{border:0;padding:0}
  .rp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp h3{break-after:avoid}
  .rp tr{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><h1>Access Review Week</h1><span>Access control matrix learning activity</span></div>
    <div class="tools">
      <span class="meter" id="meter"></span>
      <button class="btn sm" data-act="theme" id="themeBtn" aria-pressed="false">Dark mode</button>
      <button class="btn sm" data-act="reset">Start over</button>
    </div>
  </div>
  <nav class="steps" id="steps" aria-label="Activity steps"></nav>
</header>
<main class="app" id="main"></main>
<div id="pop" hidden role="dialog" aria-modal="false"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data ---------- */
const SYS=[['ERP','ERP System'],['CRM','CRM Database'],['FIN','Financial Management'],['EML','Email System'],['PLC','PLC Controls'],['HMI','HMI Stations'],['PDB','Production Database'],['QCS','Quality Control System'],['WMS','Warehouse Management'],['RFID','RFID Tracking'],['CAM','Security Cameras'],['FW','Firewall Admin'],['NMON','Network Monitoring'],['BKP','Backup Systems'],['FS','File Server']];
const CODES=SYS.map(s=>s[0]);
const SYSNAME=Object.fromEntries(SYS);
// Rights in system order: ERP CRM FIN EML PLC HMI PDB QCS WMS RFID CAM FW NMON BKP FS
const EMP0=[
 ['Carla Jennings','CEO','RRRW--RRR-----W'],
 ['Marcus Lee','COO','WRRWRRWWWRR---W'],
 ['Dr. Nia Clarke','CISO','R--WRRR---ARARR'],
 ['Elaine Harper','Finance Director','WRWW----------W'],
 ['Jason Trujillo','Network Administrator','---A------WRRAA'],
 ['Regina Moore','OT Systems Engineer','---WWAWR----R--'],
 ['Rachel Li','Compliance Officer','RRRW--RRR-RRRRR'],
 ['Mike Chen','IT Support','---W--------RRW'],
 ['Sarah Williams','Contract Coordinator','RW-W----------R'],
 ['Jennifer Martinez','Production Supervisor','---WRWWWR------'],
 ['Robert Johnson','Quality Inspector','---R--AW-------'],
 ['Lisa Zhang','Warehouse Manager','R--W--W-WW-----'],
 ['Carlos Rodriguez','Maintenance Tech','---RRR---------'],
 ['Amanda Foster','HR Manager','--WW----------W'],
 ['Kevin Brown','Sales Manager','RWWW-----------']
];
const ORIG=Object.fromEntries(EMP0.map(([n,,row])=>[n,Object.fromEntries(CODES.map((c,i)=>[c,row[i]]))]));
const PN={'-':'Deny','R':'Read','W':'Write','A':'Admin'};
const pc=v=>v==='-'?'pD':'p'+v;
const glyph=v=>v==='-'?'–':v;

const M1T=[['Regina Moore','HMI'],['Lisa Zhang','RFID'],['Rachel Li','FW']];
const PLANTED=[
 {k:'Robert Johnson|PDB',f:'EX',fix:'R'},
 {k:'Kevin Brown|FIN',f:'EX',fix:'-'},
 {k:'Amanda Foster|FIN',f:'SOD',fix:'-'},
 {k:'Lisa Zhang|PDB',f:'CR',fix:'-'}
];
const FLAGS=[
 {k:'EX',n:'Excessive privilege',s:'EX',d:'More access than the job needs'},

const Q={
 q1a:{s:'Count of admin holders',p:'At the start of the review, how many employees hold Admin (A) on at least one system?',o:['3','4','5','6'],a:1,e:'Dr. Nia Clarke, Jason Trujillo, Regina Moore, and Robert Johnson. Scanning each row for A is how you build the privileged-user list that NIST SP 800-171 3.1.7 reviews depend on.'},
 q1b:{s:'Meaning of a row',p:'What does a single row of this matrix tell you?',o:['Every right one employee holds across all systems','Every employee who can reach one system','Which person owns each system','The login history of one account'],a:0,e:'A row belongs to one subject (a person or role). Read across it and you have that subject’s complete set of rights, which is its capability list.'},
 q2a:{s:'Column stored with the object',p:'Real systems often store the column you built (everyone who can reach Backup Systems) with the object itself. What is it called?',o:['Access control list (ACL)','Capability list','Security label','Role assignment'],a:0,e:'A column read top to bottom is the object’s ACL. File system permissions and firewall rule sets are both ACLs.'},
 q2b:{s:'Why matrices are stored sparsely',p:'Why don’t most systems store the whole matrix as one big table?',o:['Most cells are deny, so it is stored sparsely as ACLs or capability lists','A matrix can’t hold more than 15 columns','Regulations prohibit a central matrix','Rows can’t contain admin rights'],a:0,e:'Real matrices are huge and mostly empty. Storing only the non-empty cells, grouped by object (ACLs) or by subject (capability lists), is far more efficient.'},
 q3a:{s:'Temporary admin evidence',p:'Jason’s firewall admin grant is temporary. What makes it audit-ready?',o:['A documented justification and an expiry date that is reviewed when it lapses','Verbal approval from the CISO','Granting Write instead of Admin','Adding him to the Backup Systems column'],a:0,e:'Assessors look for the who, why, and until-when of every privileged grant. An expiry date stops temporary access from becoming permanent.'},
 q4a:{s:'Disable rather than delete',p:'Why does a revoked row stay in the matrix, greyed out, instead of being deleted?',o:['It keeps evidence of who had access and when it was removed','RBAC systems can’t delete rows','So the person can log back in after 30 days','The assessor needs the old password'],a:0,e:'Disabled accounts and their history are audit evidence. NIST SP 800-171 3.9.2 expects you to show that access was removed when personnel actions happened.'},
 q4b:{s:'Transfers and privilege creep',p:'Mike is transferring, not leaving. Why remove everything first?',o:['Carrying old rights into a new job is privilege creep; provision the new role fresh','Transfers always end in termination','IT Support rights are illegal in other departments','So HR can reuse his account for someone else'],a:0,e:'Movers are the main source of privilege creep. Remove the old role’s rights, then grant only what the new role needs.'},
 q5a:{s:'Default deny',p:'Every new row starts with deny in every cell. Which principle is that?',o:['Default deny','Need to know','Separation of duties','Mandatory access control'],a:0,e:'Access is never assumed. Each grant has to be added on purpose, which is how least privilege starts on day one.'},
 q7a:{s:'Role-based model',p:'ACME’s zone matrix lists roles, not people. Which model is that?',o:['Role-based access control (RBAC)','Discretionary access control (DAC)','Mandatory access control (MAC)','Rule-based access control'],a:0,e:'Rights attach to roles and people inherit them through role assignment. One wrong role cell grants that access to everyone in the role, so role rows deserve extra scrutiny.'},
 q7b:{s:'Out-of-scope condition',p:'Guest Wi-Fi can stay out of scope only if…',o:['It is separated from the CUI environment so it can’t reach CUI','It requires a password','Only employees use it','The SIEM monitors it'],a:0,e:'Out-of-scope assets can’t process, store, or transmit CUI and must be logically or physically separated from assets that do.'}
};

/* ---------- Mission panel ---------- */
function mq(id,m){const q=Q[id];const sel=S.ans[id];const graded=!!S.res[m]&&sel!==undefined;
 return `<fieldset class="q"><legend>${q.p}</legend>${q.o.map((x,i)=>{let c='';if(sel===i)c='on';if(graded){if(i===q.a)c='right';else if(sel===i)c='wrong'}
  return `<button type="button" class="opt ${c}" data-act="ans" data-q="${id}" data-i="${i}" aria-pressed="${sel===i}">${x}</button>`}).join('')}${graded?`<p class="exp">${q.e}</p>`:''}</fieldset>`}
function head(m,scen){return `<div class="mhead"><div class="mnum">Mission ${m.id} of 7</div><h2 id="mt">${m.title}</h2>
 <div class="tags">${m.ksa.map(k=>`<span class="k" title="${esc(KSAN[k])}">${k}</span>`).join('')}${m.nist.map(n=>`<span>${/^\d/.test(n)?'NIST 800-171 ':''}${n}</span>`).join('')}</div></div><div class="scen">${scen}</div>`}
function foot(m){const r=S.res[m.id];
 let h=`<div class="checkrow"><button class="btn primary" data-act="check" data-m="${m.id}">Check mission</button>${r?`<button class="btn" data-act="step" data-s="${m.id+1}">${m.id<7?'Next mission':'Go to summary'}</button>`:''}</div>`;
 if(r)h+=`<div class="res" aria-live="polite"><h4>${r.score} of ${m.max} points${r.score===m.max?', mission complete':''}</h4><ul>${r.items.map(it=>`<li><span class="${it.ok?'y':'n'}" aria-hidden="true">${it.ok?'✓':'✕'}</span><span><b>${it.l}</b>${it.d?`<small>${it.d}</small>`:''}</span></li>`).join('')}</ul></div>`;
 return h}
const cellNow=(n,c)=>{const e=emp(n);return e?PN[e.p[c]]:'not found'};

 }
 if(m.id===6){

  <h3>Work in two passes</h3>
  <div class="seg2"><button class="btn ${S.m6==='flag'?'on':''}" data-act="m6" data-p="flag" aria-pressed="${S.m6==='flag'}">Flag findings</button><button class="btn ${S.m6==='edit'?'on':''}" data-act="m6" data-p="edit" aria-pressed="${S.m6==='edit'}">Fix findings</button></div>

 6(){const items=[];const pk=new Set(PLANTED.map(p=>p.k));
  PLANTED.forEach((p,i)=>{const f=S.flags[p.k];items.push({ok:f===p.f,l:`Finding ${i+1} flagged and classified`,d:!f?'Not flagged yet':(f===p.f?`${keyName(p.k)}: ${FLAGN[f].n}`:`${keyName(p.k)} is flagged, but the category isn’t right`)})});
  const extra=Object.keys(S.flags).filter(k=>!pk.has(k));
  items.push({ok:!extra.length,l:'No false positives',d:extra.length?'Not a policy problem: '+extra.map(keyName).join(', '):'Every flag is a real finding'});
  PLANTED.forEach((p,i)=>{const[n,c]=p.k.split('|');const v=emp(n).p[c];const flagged=S.flags[p.k]===p.f;
   items.push({ok:flagged&&v===p.fix,l:`Finding ${i+1} remediated`,d:!flagged?'Flag it correctly first':(v===p.fix?`${keyName(p.k)} set to ${PN[v]}`:`${keyName(p.k)} is ${PN[v]}; reduce it to the least access the job needs`)})});
  return items},
 7(){const items=CATS.map(([c,label])=>{const of=ASSETS.filter(a=>a[1]===c);const wrong=of.filter(a=>S.assets[a[0]]&&S.assets[a[0]]!==c),un=of.filter(a=>!S.assets[a[0]]);
   return{ok:!wrong.length&&!un.length,l:`${label}s identified`,d:!wrong.length&&!un.length?`All ${of.length} correct`:[wrong.length?`${wrong.length} of ${of.length} placed in another category`:'',un.length?`${un.length} not classified yet`:''].filter(Boolean).join('. ')}});
  RB_PLANT.forEach((k,i)=>items.push({ok:S.rbac[k]==='-',l:`Segmentation fix ${i+1}`,d:S.rbac[k]==='-'?`${k.replace('|',' × ')} zone set to deny`:'One role still has a zone grant its duties don’t justify'}));
  const changed=Object.keys(RBAC0).filter(k=>!RB_PLANT.includes(k)&&S.rbac[k]!==RBAC0[k]);
  items.push({ok:!changed.length,l:'Legitimate zone grants left alone',d:changed.length?'Changed without cause: '+changed.map(k=>k.replace('|',' × ')).join(', '):'No collateral changes'});
  return items.concat([qItem('q7a'),qItem('q7b')])}
};
function runCheck(m){const items=CHECKS[m]();const sc=items.filter(i=>i.ok).length;const prev=S.res[m];
 S.res[m]={score:sc,items,tries:(prev?prev.tries:0)+1,t:new Date().toLocaleString()};
 const mx=MISSIONS.find(x=>x.id===m).max;
 log('Mission checked',`Mission ${m}: ${sc} of ${mx} points`);
 render();toast(sc===mx?`Mission ${m} complete: ${sc} of ${mx} points.`:`Mission ${m}: ${sc} of ${mx} points. Review the items marked with an ✕.`,sc===mx?'ok':'warn');
 const r=$('.res');if(r)r.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}

/* ---------- Summary & report ---------- */
function ksaPct(k){
 if(k.m[0]==='report'){return Math.round(MISSIONS.filter(m=>S.res[m.id]).length/MISSIONS.length*100)}
 if(k.m[0]==='statement'){const l=(S.statement||'').trim().length;return l>=60?100:l>0?50:0}
 let s=0,mx=0;k.m.forEach(id=>{const m=MISSIONS.find(x=>x.id===id);mx+=m.max;s+=S.res[id]?S.res[id].score:0});return mx?Math.round(s/mx*100):0}
function reportHTML(){
 const sc=score(),pct=Math.round(sc/TOTAL*100);
 const verdict=pct>=90?'Audit-ready':pct>=75?'Nearly there':'More practice needed';
 const mrows=MISSIONS.map(m=>{const r=S.res[m.id];return `<tr><td>${m.id}. ${m.title}</td><td>${r?r.score:0} / ${m.max}</td><td>${r?r.tries:0}</td><td>${!r?'Not checked':(r.score===m.max?'<span class="ok">Complete</span>':'<span class="no">Partial</span>')}</td></tr>`}).join('');
 const krows=['Knowledge','Skills','Abilities'].map(g=>`<tr><th colspan="3">${g}</th></tr>`+KSA.filter(k=>k.g===g).map(k=>{const p=ksaPct(k);return `<tr><td><b>${k.id}</b> ${k.n}</td><td style="width:160px"><div class="bar2"><i style="width:${p}%"></i></div></td><td style="width:56px">${p}%</td></tr>`}).join('')).join('');
 const frows=Object.entries(S.flags).map(([k,f])=>{const[n,c]=k.split('|');const e=emp(n);const p=PLANTED.find(x=>x.k===k);const status=!p?'Not a finding':(p.f!==f?'Misclassified':(e.p[c]===p.fix?'Remediated':'Open'));
  return `<tr><td>${esc(keyName(k))}</td><td>${FLAGN[f].n}</td><td>${PN[e.p[c]]}</td><td>${status==='Remediated'?'<span class="ok">Remediated</span>':status}</td></tr>`}).join('')||'<tr><td colspan="4">No findings flagged.</td></tr>';
 const lrows=S.log.filter(l=>!/^Mission checked|^Lookup|^Report|^Matrix exported/.test(l.a)).map(l=>`<tr><td style="white-space:nowrap">${esc(l.t)}</td><td>${esc(l.a)}</td><td>${esc(l.d)}</td></tr>`).join('')||'<tr><td colspan="3">No changes recorded.</td></tr>';
 const mx=`<table class="mx"><tr><th style="text-align:left">Employee</th>${CODES.map(c=>`<th title="${SYSNAME[c]}">${c}</th>`).join('')}</tr>${S.emps.map(e=>`<tr><td class="nm">${esc(e.n)}${e.off?' (revoked)':''}</td>${CODES.map(c=>`<td>${glyph(e.p[c])}</td>`).join('')}</tr>`).join('')}</table>`;
 return `<div class="rp"><h2>Access Review Week: summary</h2>
 <p class="meta">${esc(S.name||'Student name not entered')}. Generated ${new Date().toLocaleString()}.</p>
 <div class="big"><div><b>${sc} / ${TOTAL}</b>points</div><div><b>${pct}%</b>overall</div><div><b>${MISSIONS.filter(m=>S.res[m.id]&&S.res[m.id].score===m.max).length} / 7</b>missions complete</div><div><b>${verdict}</b>status</div></div>
 <h3>Mission results</h3><table><tr><th>Mission</th><th>Score</th><th>Checks</th><th>Status</th></tr>${mrows}</table>
 <h3>Knowledge, skills, and abilities</h3><table>${krows}</table>
 <h3>Reviewer’s statement to the auditor</h3><div class="stmt">${esc(S.statement)||'No statement written yet.'}</div>
 <h3>Access review findings (FreshFlow Systems)</h3><table><tr><th>Cell</th><th>Category</th><th>Current right</th><th>Status</th></tr>${frows}</table>
 <h3>Change log</h3><table><tr><th>Time</th><th>Action</th><th>Detail</th></tr>${lrows}</table>
 <h3>Final FreshFlow matrix</h3><div class="rpwrap">${mx}</div>
 <p class="meta" style="margin-top:8px">Key: A Admin, W Write, R Read, – Deny. ${SYS.map(s=>s[0]+' '+s[1]).join('; ')}.</p></div>`}
const RP_CSS=[...document.styleSheets[0].cssRules].filter(r=>r.selectorText&&r.selectorText.startsWith('.rp')).map(r=>r.cssText).join('\n');
function summary(){
 const missing=MISSIONS.filter(m=>!S.res[m.id]);
 return `<div class="sumgrid"><aside class="panel sumctl"><h2 style="font-size:24px">Your evidence package</h2>
 <label style="display:grid;gap:4px;font-weight:600;font-size:14px">Your name<input type="text" data-bind="name" value="${esc(S.name)}" autocomplete="name"></label>
 <label style="display:grid;gap:4px;font-weight:600;font-size:14px">Statement to the auditor<textarea data-bind="statement" rows="6" placeholder="In two or three sentences, summarize the biggest access risk you found, what you changed, and what FreshFlow or ACME should do next.">${esc(S.statement)}</textarea></label>
 <p class="note">The statement demonstrates ability A3. Aim for at least 60 characters.</p>
 ${missing.length?`<p class="note">Not yet checked: missions ${missing.map(m=>m.id).join(', ')}.</p>`:''}
 <button class="btn primary" data-act="print">Print or save as PDF</button>
 <button class="btn" data-act="dlReport">Download report (HTML)</button>
 <button class="btn" data-act="dlCsv">Export matrix (CSV)</button>
 <p class="note">To save a PDF, choose Save as PDF as the printer.</p></aside>
 <section class="panel" id="rpbox">${reportHTML()}</section></div>`}

render();
</script>
</body>
</html>
