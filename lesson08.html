<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 8: Security Operations &amp; Monitoring | CompTIA Security+ SY0-701</title>
<style>
/* ============================================================   DESIGN TOKENS   ============================================================ */
:root {
  --bg:          #ffffff;
  --bg-soft:     #f7f9f7;
  --bg-card:     #ffffff;
  --border:      #d8e4d8;
  --border-dark: #b2ccb2;
  --text:        #111111;
  --text-mid:    #3a4a3a;
  --text-muted:  #5c6e5c;
  --green-dark:  #1b5e20;
  --green:       #2e7d32;
  --green-mid:   #388e3c;
  --green-light: #4caf50;
  --green-pale:  #e8f5e9;
  --green-pale2: #c8e6c9;
  --red:         #b71c1c;
  --red-pale:    #ffebee;
  --red-mid:     #c62828;
  --blue:        #1565c0;
  --blue-pale:   #e3f2fd;
  --purple:      #6a1b9a;
  --purple-pale: #f3e5f5;
  --amber:       #e65100;
  --amber-pale:  #fff3e0;
  --teal:        #00695c;
  --teal-pale:   #e0f2f1;
  --shadow-sm:   0 1px 4px rgba(0,0,0,0.08);
  --shadow-md:   0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg:   0 8px 32px rgba(0,0,0,0.13);
  --radius:      10px;
  --radius-lg:   16px;
}
[data-theme="dark"] {
  --bg:          #0e120e;
  --bg-soft:     #141a14;
  --bg-card:     #1a221a;
  --border:      #2a3a2a;
  --border-dark: #3a4e3a;
  --text:        #e8f0e8;
  --text-mid:    #b8ccb8;
  --text-muted:  #7a9a7a;
  --green-dark:  #81c784;
  --green:       #4caf50;
  --green-mid:   #66bb6a;
  --green-light: #a5d6a7;
  --green-pale:  #1a2e1a;
  --green-pale2: #1e3a1e;
  --red:         #ef9a9a;
  --red-pale:    #2a1010;
  --red-mid:     #ef9a9a;
  --blue:        #90caf9;
  --blue-pale:   #0d1f35;
  --purple:      #ce93d8;
  --purple-pale: #1f0d2a;
  --amber:       #ffcc80;
  --amber-pale:  #2a1a00;
  --teal:        #80cbc4;
  --teal-pale:   #0d2520;
  --shadow-sm:   0 1px 4px rgba(0,0,0,0.30);
  --shadow-md:   0 4px 16px rgba(0,0,0,0.40);
  --shadow-lg:   0 8px 32px rgba(0,0,0,0.50);
}
/* ============================================================   RESET & BASE   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', Arial, Helvetica, sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.65; font-size: 16px;
  transition: background 0.3s, color 0.3s;
}
h1,h2,h3,h4 { line-height: 1.25; font-weight: 700; }
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; }
ul { padding-left: 1.4em; }
li { margin-bottom: 0.35em; }

/* ============================================================   HEADER   ============================================================ */
header {
  background: var(--green-dark); color: #fff;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}
.header-inner {
  max-width: 1180px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: center;
  justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.brand-icon {
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px; letter-spacing: -0.5px; color: #fff; flex-shrink: 0;
}
.brand-info h1 { font-size: 1rem; font-weight: 700; }
.brand-info p  { font-size: 0.74rem; opacity: 0.7; margin-top: 1px; }
.header-right  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lesson-badge {
  background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.28);
  color: #fff; font-size: 0.7rem; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.07em;
}
.nav-link {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
  color: #fff; font-size: 0.8rem; font-weight: 600;
  padding: 6px 14px; border-radius: 20px;
  transition: background 0.2s; text-decoration: none; display: inline-block;
}
.nav-link:hover { background: rgba(255,255,255,0.25); text-decoration: none; }
.theme-btn {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
  color: #fff; font-size: 0.8rem; font-weight: 600;
  padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: background 0.2s;
}
.theme-btn:hover { background: rgba(255,255,255,0.25); }

/* ============================================================   HERO   ============================================================ */
.hero {
  background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 42%, #1565c022 100%);
  color: #fff; padding: 48px 24px 40px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: '08';
  position: absolute; right: 40px; bottom: -10px;
  font-size: 120px; font-weight: 900;
  opacity: 0.07; line-height: 1; pointer-events: none;
}
.hero-inner { max-width: 860px; margin: 0 auto; }
.hero-eyebrow {
  font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; opacity: 0.8; margin-bottom: 10px;
}
.hero h2 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
.hero-sub { font-size: 1rem; opacity: 0.85; max-width: 640px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.hero-tag {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
  font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border-radius: 20px;
}

/* ============================================================   LAYOUT   ============================================================ */
.page-body { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; }
.section-gap { margin-bottom: 48px; }
.section-label {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--green);
  margin-bottom: 14px; padding-bottom: 8px;
  border-bottom: 2px solid var(--green-pale2);
  display: flex; align-items: center; gap: 8px;
}
.section-label::before {
  content: ''; display: block; width: 4px; height: 16px;
  background: var(--green); border-radius: 2px;
}

/* ============================================================   OBJECTIVES   ============================================================ */
.objectives-box {
  background: var(--green-pale); border: 1px solid var(--green-pale2);
  border-left: 5px solid var(--green); border-radius: var(--radius); padding: 24px 28px;
}
.objectives-box h3 { color: var(--green-dark); margin-bottom: 12px; font-size: 1rem; }
.objectives-box li { margin-bottom: 8px; color: var(--text-mid); font-size: 0.93rem; }
.objectives-box li::marker { color: var(--green); }

/* ============================================================   KEY TERMS   ============================================================ */
.terms-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
}
.term-card {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.term-name { font-weight: 700; font-size: 0.88rem; color: var(--green-dark); margin-bottom: 4px; }
.term-def  { font-size: 0.82rem; color: var(--text-mid); line-height: 1.5; }

/* ============================================================   INTRO CARD   ============================================================ */
.intro-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 5px solid var(--green-light);
  border-radius: var(--radius-lg); padding: 28px 32px; box-shadow: var(--shadow-sm);
}
.intro-card p { color: var(--text-mid); font-size: 0.97rem; line-height: 1.75; }
.intro-card p + p { margin-top: 12px; }

/* ============================================================   FLIP CARDS   ============================================================ */
.flip-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;
}
.flip-wrapper { perspective: 1000px; height: 240px; cursor: pointer; }
.flip-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform 0.6s cubic-bezier(0.4,0.2,0.2,1);
  transform-style: preserve-3d;
}
.flip-wrapper.flipped .flip-inner { transform: rotateY(180deg); }
.flip-front, .flip-back {
  position: absolute; width: 100%; height: 100%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--radius-lg); padding: 24px;
  display: flex; flex-direction: column; justify-content: space-between;
  border: 1px solid var(--border); box-shadow: var(--shadow-md);
}
.flip-front { background: var(--bg-card); }
.flip-back  { background: var(--green-dark); color: #fff; transform: rotateY(180deg); }
.flip-num   { font-size: 2.5rem; font-weight: 900; color: var(--green-pale2); line-height: 1; }
.flip-front h3 { font-size: 1.05rem; color: var(--green-dark); margin-bottom: 6px; }
.flip-front p  { font-size: 0.82rem; color: var(--text-muted); }
.flip-hint { font-size: 0.7rem; color: var(--text-muted); }
.flip-back h3  { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; opacity: 0.9; }
.flip-back p   { font-size: 0.82rem; opacity: 0.85; line-height: 1.55; flex: 1; }
.flip-back-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.flip-back a.dive-link, .flip-back a.dive-download {
  display: inline-block; background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff; font-size: 0.72rem; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; text-decoration: none;
  transition: background 0.2s;
}
.flip-back a.dive-link:hover, .flip-back a.dive-download:hover { background: rgba(255,255,255,0.28); }

/* ============================================================   TOPIC SECTIONS   ============================================================ */
.topic-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  margin-bottom: 28px; box-shadow: var(--shadow-sm);
}
.topic-header {
  background: var(--green); color: #fff;
  padding: 18px 28px; display: flex; align-items: center; gap: 14px;
}
.topic-header-num {
  width: 36px; height: 36px; background: rgba(0,0,0,0.2); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; font-weight: 900; flex-shrink: 0;
}
.topic-header h3 { font-size: 1.1rem; }
.topic-header p  { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
.topic-body { padding: 28px; }
.topic-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
.topic-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 18px; }

.concept-block {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
}
.concept-block h4 {
  font-size: 0.92rem; color: var(--green-dark);
  margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.concept-icon {
  width: 24px; height: 24px; background: var(--green-pale2);
  border-radius: 6px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 13px;
}
.concept-block p, .concept-block ul { font-size: 0.87rem; color: var(--text-mid); line-height: 1.6; }

.ctrl-card {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-left: 4px solid var(--green);
  border-radius: var(--radius); padding: 16px;
}
.ctrl-card.blue   { border-left-color: var(--blue); }
.ctrl-card.purple { border-left-color: var(--purple); }
.ctrl-card.amber  { border-left-color: var(--amber); }
.ctrl-card.teal   { border-left-color: var(--teal); }
.ctrl-card.red    { border-left-color: var(--red); }
.ctrl-card h4 {
  font-size: 0.9rem; margin-bottom: 8px; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.ctrl-card p, .ctrl-card ul { font-size: 0.84rem; color: var(--text-mid); line-height: 1.55; }
.ctrl-card ul { margin-top: 6px; }

/* Callouts */
.callout {
  background: var(--green-pale); border-left: 4px solid var(--green);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 18px; margin-top: 16px; font-size: 0.87rem; color: var(--text-mid);
}
.callout strong { color: var(--green-dark); }
.callout-amber {
  background: var(--amber-pale); border-left: 4px solid var(--amber);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 18px; margin-top: 16px; font-size: 0.87rem; color: var(--text-mid);
}
.callout-amber strong { color: var(--amber); }
.callout-blue {
  background: var(--blue-pale); border-left: 4px solid var(--blue);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 18px; margin-top: 16px; font-size: 0.87rem; color: var(--text-mid);
}
.callout-blue strong { color: var(--blue); }
.callout-red {
  background: var(--red-pale); border-left: 4px solid var(--red);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 18px; margin-top: 16px; font-size: 0.87rem; color: var(--text-mid);
}
.callout-red strong { color: var(--red-mid); }

/* ============================================================   ACTIVITIES   ============================================================ */
.activity-box {
  background: var(--bg-card); border: 2px solid var(--green-pale2);
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md);
}
.activity-header {
  background: var(--green-dark); color: #fff;
  padding: 16px 24px; display: flex; align-items: center; gap: 12px;
}
.activity-badge {
  background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.28);
  font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.activity-header h3 { font-size: 1rem; }
.activity-header p  { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
.activity-body { padding: 24px; }
.activity-instructions {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  font-size: 0.85rem; color: var(--text-mid); margin-bottom: 20px;
}
.activity-result {
  margin-top: 14px; padding: 12px 16px; border-radius: var(--radius);
  font-size: 0.88rem; font-weight: 600; display: none;
}
.result-pass { background: var(--green-pale); color: var(--green-dark); border: 1px solid var(--green-pale2); }
.result-fail { background: var(--red-pale); color: var(--red); border: 1px solid #ffcdd2; }
.activity-actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-primary {
  background: var(--green-dark); color: #fff; border: none;
  padding: 10px 22px; border-radius: 8px; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; transition: background 0.2s, transform 0.15s;
}
.btn-primary:hover { background: var(--green); transform: translateY(-1px); }
.btn-secondary {
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border-dark); padding: 10px 22px;
  border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
}
.btn-secondary:hover { background: var(--border); }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-danger { background: var(--red-mid); color: #fff; }
.btn-danger:hover { background: var(--red); }

/* ============================================================   EXAM PILLS   ============================================================ */
.pill {
  display: inline-block; background: var(--green-pale); color: var(--green);
  border: 1px solid var(--green-light); padding: 3px 10px;
  border-radius: 20px; font-size: 0.72rem; font-weight: 700;
}
.pill.blue { background: var(--blue-pale); color: var(--blue); border-color: var(--blue); }

/* ============================================================   DRIFT DETECTIVE   ============================================================ */
.drift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.config-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.config-panel-header { padding: 10px 16px; font-weight: 700; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
.config-panel-header.secure  { background: var(--green-pale); color: var(--green-dark); }
.config-panel-header.drifted { background: var(--red-pale); color: var(--red-mid); }
.config-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; transition: background 0.15s; }
.config-row:last-child { border-bottom: none; }
.config-row.clickable { cursor: pointer; }
.config-row.clickable:hover { background: var(--amber-pale); }
.config-row.found  { background: var(--green-pale) !important; color: var(--green-dark); }
.config-row.missed { background: var(--red-pale) !important; }
.cv { font-weight: 700; font-size: 0.82rem; }
.cv.ok  { color: var(--green-dark); }
.cv.bad { color: var(--red-mid); }
.drift-score { margin-top: 14px; padding: 12px 16px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

/* ============================================================   ASSET HUNTER   ============================================================ */
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.asset-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: border-color 0.2s; }
.asset-card.tagged  { border-color: var(--green); background: var(--green-pale); }
.asset-card.flagged { border-color: var(--red); background: var(--red-pale); }
.asset-icon { font-size: 1.6rem; margin-bottom: 6px; }
.asset-name { font-weight: 700; font-size: 0.88rem; }
.asset-meta { font-size: 0.76rem; color: var(--text-muted); margin: 3px 0 8px; line-height: 1.5; }
.asset-btns { display: flex; gap: 6px; }

/* ============================================================   LOG SIMULATOR   ============================================================ */
.log-config { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.thresh-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.thresh-label { font-size: 0.82rem; font-weight: 700; flex-shrink: 0; }
.thresh-input { width: 70px; padding: 6px 10px; border: 2px solid var(--border-dark); border-radius: var(--radius); background: var(--bg-card); color: var(--text); font-size: 0.88rem; font-weight: 700; }
.thresh-input:focus { outline: none; border-color: var(--green); }
.thresh-unit { font-size: 0.78rem; color: var(--text-muted); }
.log-window { background: #0c1a0c; border: 1px solid #2a3a2a; border-radius: var(--radius); height: 220px; overflow-y: auto; padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 0.78rem; margin-bottom: 12px; }
.log-line       { padding: 2px 0; color: #7ec87e; }
.log-line.warn  { color: #ffca28; }
.log-line.alert { color: #ff5252; font-weight: 700; }
.log-line.info  { color: #64b5f6; }
#alertBanner { display: none; background: var(--red-pale); border: 2px solid var(--red); border-radius: var(--radius); padding: 12px 16px; color: var(--red-mid); font-weight: 700; font-size: 0.9rem; margin-bottom: 10px; }
#alertBanner.show { display: block; }

/* ============================================================   SANDBOX ENGINE   ============================================================ */
.sandbox-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 18px; margin-top: 14px; }
.file-tray { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.file-item { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 10px 13px; margin-bottom: 10px; cursor: grab; transition: border-color 0.2s, box-shadow 0.2s; user-select: none; }
.file-item:hover { border-color: var(--green); box-shadow: var(--shadow-md); }
.file-item.dragging { opacity: 0.5; cursor: grabbing; }
.file-item.placed { opacity: 0.4; pointer-events: none; }
.file-name { font-weight: 700; font-size: 0.85rem; }
.file-meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }
.drop-zones { display: grid; grid-template-columns: 1fr; gap: 10px; }
.drop-zone { background: var(--bg-soft); border: 2px dashed var(--border-dark); border-radius: var(--radius); padding: 14px; min-height: 90px; transition: border-color 0.2s, background 0.2s; }
.drop-zone.dragover { border-color: var(--green); background: var(--green-pale); }
.dz-label { font-weight: 700; font-size: 0.82rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.dz-label.run     { color: var(--blue); }
.dz-label.scan    { color: var(--amber); }
.dz-label.sandbox { color: var(--green-dark); }
.dz-items { display: flex; flex-direction: column; gap: 6px; }
.placed-file { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
.placed-file .pfname { font-weight: 700; }
.fb-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; white-space: nowrap; }
.fb-good { background: var(--green-pale2); color: var(--green-dark); }
.fb-ok   { background: var(--amber-pale); color: var(--amber); }
.fb-bad  { background: var(--red-pale); color: var(--red-mid); }

/* ============================================================   QUIZ   ============================================================ */
.quiz-q { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; transition: border-color 0.3s;}
.quiz-q.answered-correct { border-color: var(--green); background: var(--green-pale); }
.quiz-q.answered-wrong   { border-color: var(--red);   background: var(--red-pale); }
.q-num  { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; }
.q-stag { display: inline-block; background: var(--amber-pale); color: var(--amber); border: 1px solid var(--amber); padding: 1px 8px; border-radius: 10px; font-size: 0.66rem; font-weight: 700; margin-left: 8px; }
.q-mctag { display: inline-block; background: var(--green-pale); color: var(--green); border: 1px solid var(--green); padding: 1px 8px; border-radius: 10px; font-size: 0.66rem; font-weight: 700; margin-left: 8px; }
.q-text { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 14px; line-height: 1.45; }
