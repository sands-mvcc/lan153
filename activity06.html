<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Identity and Access Lab: Lakeshore Health Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('iam-lab-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --bg:#F4F7FC;--surface:#FFFFFF;--surface-2:#EAF0FA;--ink:#13203B;--ink-2:#4B5875;--line:#D3DCEB;
  --navy:#0047AB;--navy-ink:#0047AB;--band:#0047AB;--green:#00a86b;--green-ink:#00754B;--green-soft:#E2F6EE;
  --red:#B3261E;--red-soft:#FCE9E7;--amber:#8F5400;--amber-soft:#FFF1D6;--focus:#0047AB;
  --shadow:0 12px 26px -18px rgba(10,40,100,.55);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1423;--surface:#142038;--surface-2:#1A2946;--ink:#E6ECF7;--ink-2:#A9B5CC;--line:#2A3B5C;
    --navy:#7AA7FF;--navy-ink:#8FB5FF;--band:#1D4FAE;--green:#2BD69B;--green-ink:#4FE0AE;--green-soft:#0F3A2D;
    --red:#FF8A7E;--red-soft:#3D1A1A;--amber:#F2B451;--amber-soft:#3A2A0E;--focus:#8FB5FF;
    --shadow:0 12px 26px -18px rgba(0,0,0,.9);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1423;--surface:#142038;--surface-2:#1A2946;--ink:#E6ECF7;--ink-2:#A9B5CC;--line:#2A3B5C;
  --navy:#7AA7FF;--navy-ink:#8FB5FF;--band:#1D4FAE;--green:#2BD69B;--green-ink:#4FE0AE;--green-soft:#0F3A2D;
  --red:#FF8A7E;--red-soft:#3D1A1A;--amber:#F2B451;--amber-soft:#3A2A0E;--focus:#8FB5FF;
  --shadow:0 12px 26px -18px rgba(0,0,0,.9);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:800}
h2{font-size:clamp(1.55rem,2.6vw,2rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--navy-ink)}
code,.mono{font-family:var(--mono);font-size:.92em}
img{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted,.hint{color:var(--ink-2)}
.hint{font-size:.88rem;display:block;margin-top:.25rem}
.print-only{display:none}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.site-header .inner{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.1}
.mark small{color:var(--ink-2);font-size:.85rem}
.meter{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink-2)}
.meter .track{width:120px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .fill{height:100%;background:var(--green);width:0;transition:width .5s ease}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:.6rem 1rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:.5rem;text-decoration:none}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--band);border-color:var(--band);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:.4rem .75rem;font-size:.9rem}
.ticon{font-size:1.05em;line-height:1}

/* layout */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 290px;gap:28px;max-width:1440px;margin:0 auto;padding:24px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rail button{width:100%;text-align:left;font:inherit;background:none;border:1px solid transparent;color:var(--ink);padding:.6rem .7rem;border-radius:10px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="page"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.rail .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--ink-2)}
.rail .n.done{background:var(--green);border-color:var(--green);color:#04241A}
.rail .n.part{border-color:var(--amber);color:var(--amber)}
.rail .t{font-weight:700;line-height:1.25}
.rail .s{display:block;font-size:.82rem;color:var(--ink-2);font-weight:400}
.rail .reset{margin-top:14px}
main{min-width:0}
.view{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,3vw,40px);box-shadow:var(--shadow)}
.view > *{max-width:860px}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:68ch}
.mnum{font-family:var(--display);font-weight:700;color:var(--navy-ink);margin-bottom:.3em}
.part{margin-top:2.2rem;padding-top:1.6rem;border-top:1px solid var(--line)}
.part > p{max-width:70ch}

/* directory */
.dir{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
.dir h2{font-size:1.25rem;margin-bottom:.2em}
.dir > p{font-size:.92rem}
#badges{display:grid;gap:14px;margin-top:12px}

/* badge */
.badge{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.badge .band{background:var(--band);color:#fff;font-size:.78rem;padding:16px 14px 7px;position:relative;font-weight:700;letter-spacing:.01em}
.badge .band::before{content:"";position:absolute;top:6px;left:50%;width:34px;height:6px;margin-left:-17px;border-radius:4px;background:var(--surface)}
.badge.priv .band{background:repeating-linear-gradient(135deg,#00754B 0 10px,#00865a 10px 20px)}
.badge.alert{border-color:var(--red)}
.badge.alert .band{background:var(--red);color:#fff}
.badge.pending{opacity:.62}
.badge.pending .b-user{font-style:italic}
.b-body{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 14px 6px;align-items:center}
.avatar{width:48px;height:56px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--navy-ink)}
.b-name{font-weight:700;margin:0;line-height:1.2}
.b-title{margin:0;font-size:.85rem;color:var(--ink-2)}
.b-user{margin:.15rem 0 0;font-family:var(--mono);font-size:.85rem;color:var(--navy-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 14px}
.chip{display:inline-block;font-size:.78rem;padding:.15rem .55rem;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);line-height:1.5}
.chip.good{background:var(--green-soft);border-color:transparent;color:var(--green-ink)}
.chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.bad{background:var(--red-soft);border-color:transparent;color:var(--red)}
.chip.dim{color:var(--ink-2);background:transparent;border-style:dashed}
@keyframes stamp{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.badge.fresh{animation:stamp .35s ease-out}

/* briefing */
.brief-hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,.8fr);gap:36px;align-items:center;max-width:none}
.brief-hero h1{max-width:15ch}
.hero-badge{transform:rotate(2.5deg);max-width:300px;justify-self:center;width:100%}
.hero-badge .badge{box-shadow:0 30px 50px -28px rgba(0,40,110,.6)}
.hero-badge .b-body{grid-template-columns:72px 1fr;padding:18px}
.hero-badge .avatar{width:72px;height:86px;font-size:1.6rem}
.hero-badge .b-name{font-size:1.2rem}
.lanyard{width:10px;height:44px;margin:0 auto -6px;background:var(--navy);border-radius:4px 4px 0 0;opacity:.85}
.name-field{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:1.2rem 0}
.name-field label{flex:1 1 240px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:1rem 0 0;padding:0;list-style:none;max-width:none}
.how li{background:var(--surface-2);border-radius:12px;padding:14px 16px}
.how b{display:block;font-family:var(--display);margin-bottom:.2em}
details.ksa{margin-top:1.6rem;border:1px solid var(--line);border-radius:14px;max-width:none}
details.ksa summary{cursor:pointer;padding:14px 18px;font-weight:700;font-family:var(--display);font-size:1.1rem}
.ksa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 18px 18px}
.ksa-grid h3{font-size:1rem;color:var(--navy-ink)}
.ksa-grid ul{margin:0;padding-left:1.1rem;font-size:.95rem}
.ksa-grid li{margin-bottom:.45rem}
.ksa-grid .code{font-family:var(--mono);font-size:.8rem;color:var(--ink-2)}

/* forms */
label{display:block;font-weight:700;font-size:.95rem}
.lbl{display:block;margin-bottom:.3rem}
input[type="text"],input[type="date"],select,textarea{font:inherit;font-weight:400;width:100%;padding:.55rem .7rem;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:.3rem}
textarea{min-height:110px;resize:vertical}
select{cursor:pointer}
fieldset{border:0;padding:0;margin:0 0 .9rem}
legend{font-weight:700;font-size:.95rem;margin-bottom:.35rem;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.stack{flex-direction:column}
.opt{font-weight:400;display:flex;gap:.55rem;align-items:flex-start;cursor:pointer;padding:.5rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt input{margin:.3rem 0 0;accent-color:var(--navy)}
.opt:has(input:checked){border-color:var(--navy);background:var(--surface-2)}
.opts.seg .opt{padding:.4rem .8rem}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface)}
.standard{background:var(--surface-2);border:0}
.standard ul{margin:0;padding-left:1.1rem}
.standard li{margin-bottom:.35rem}
details.existing{margin-top:12px}
details.existing summary{cursor:pointer;font-weight:700;color:var(--navy-ink)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.5rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tickets{display:grid;gap:16px;margin-top:1.4rem}
.ticket{border:1px solid var(--line);border-radius:14px;padding:18px 20px;border-left:5px solid var(--navy)}
.ticket.shared{border-left-color:var(--amber)}
.t-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.t-head h3{margin:0}
.req{font-family:var(--mono);font-size:.8rem;color:var(--ink-2)}
.t-meta{flex-basis:100%;margin:.2rem 0 .3rem;color:var(--ink-2)}
.t-detail{margin-bottom:.9rem}
blockquote{margin:.4rem 0 1rem;padding:.6rem 1rem;border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 10px 10px 0}
.ticket .when-provision,.ticket .when-reject,.req-card .when-jit{display:none}
.ticket[data-decision="provision"] .when-provision{display:grid}
.ticket[data-decision="reject"] .when-reject{display:block}
.req-card[data-decision="jit"] .when-jit{display:block}

/* factor sort */
.sorter{display:grid;gap:14px}
.pool{border:2px dashed var(--line);border-radius:14px;padding:12px}
.buckets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bucket{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface-2);min-height:110px}
.bucket-btn{font:inherit;font-weight:700;font-family:var(--display);width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;cursor:pointer;color:var(--ink)}
.bucket-btn:hover{border-color:var(--navy)}
.sorter.armed .bucket-btn{border-color:var(--navy);box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 25%,transparent)}
.bucket-items,.pool-items{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fchip{font:inherit;font-size:.92rem;cursor:pointer;padding:.4rem .75rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:#fff}
.empty{margin:0;font-size:.88rem;color:var(--ink-2)}
#factor-hint{min-height:1.4em;font-size:.92rem;color:var(--amber);margin:0}

.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(200px,1fr);gap:12px 20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row p{margin:0}
.row .fb{grid-column:1/-1}

/* matrix */
.matrix th[scope="col"]{font-size:.82rem;font-weight:700;vertical-align:bottom;min-width:92px}
.matrix th[scope="row"]{min-width:180px}
.matrix th[scope="row"] .hint{font-weight:400}
.matrix td{text-align:center;vertical-align:middle}
.cell{display:grid;place-items:center;min-height:36px;cursor:pointer}
.cell input{width:22px;height:22px;accent-color:var(--navy);cursor:pointer}
.matrix tbody tr:hover{background:var(--surface-2)}

.req-card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.req-card h4{margin:0 0 .25rem;font-family:var(--display);font-size:1.05rem}
.req-card .when-jit{margin-top:10px;max-width:260px}

.accts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.acct{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.acct header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.acct code{font-size:1rem;color:var(--navy-ink);font-weight:700}
.acct p{margin:0;font-size:.93rem}
.acct .hr{color:var(--ink-2)}
.acct select{margin-top:6px}
.log{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:10px;display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.log time{font-family:var(--mono);font-size:.82rem;color:var(--ink-2)}
.log p{margin:0}
.log .fb{grid-column:1/-1}

/* feedback */
.fb{margin-top:10px;padding:.6rem .85rem;border-radius:10px;font-size:.95rem;border-left:4px solid}
.fb.ok{background:var(--green-soft);border-color:var(--green)}
.fb.bad{background:var(--red-soft);border-color:var(--red)}
.fb strong{margin-right:.3rem}
.fb.ok strong{color:var(--green-ink)}
.fb.bad strong{color:var(--red)}
.checkbar{margin-top:2.4rem;padding-top:1.4rem;border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.result{flex-basis:100%;border-radius:14px;padding:16px 18px;background:var(--surface-2);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.result .score{font-family:var(--display);font-size:1.6rem;font-weight:800}
.result.perfect{background:var(--green-soft)}
.result p{margin:0}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.result.new{animation:rise .4s ease-out}

/* summary */
.sum-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start;max-width:none}
.big-scores{display:flex;gap:14px;flex-wrap:wrap;margin:1.2rem 0;max-width:none}
.big-scores div{background:var(--surface-2);border-radius:14px;padding:14px 18px;min-width:170px}
.big-scores b{display:block;font-family:var(--display);font-size:2.1rem;line-height:1.1}
.big-scores span{font-size:.9rem;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--navy)}
.bar i.good{background:var(--green)}
.bar i.warn{background:var(--amber)}
.ksa-table td:nth-child(3){width:30%}
.revisit li{margin-bottom:.6rem}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:1180px){
  .layout{grid-template-columns:200px minmax(0,1fr)}
  .rail{grid-row:span 2}
  .dir{position:static;max-height:none;grid-column:2}
  #badges{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding:14px;gap:18px}
  .rail{position:static;grid-row:auto}
  .rail ol{flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .rail li{flex:none}
  .rail button{grid-template-columns:26px auto;white-space:nowrap}
  .rail .s{display:none}
  .dir{grid-column:1}
  .brief-hero,.how,.ksa-grid,.form-grid,.buckets,.accts{grid-template-columns:minmax(0,1fr)}
  .hero-badge{max-width:260px}
  .row{grid-template-columns:minmax(0,1fr)}
  .log{grid-template-columns:minmax(0,1fr)}
  .meter .track,.meter .mtext{display:none}
  .site-header .inner{padding:10px 14px}
  .mark small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#F1F4F9;--ink:#000;--ink-2:#333;--line:#bbb;--navy:#0047AB;--navy-ink:#0047AB;--green-soft:#E6F6EE;--red-soft:#FBEAEA;--amber-soft:#FFF4DD;color-scheme:light;padding:0}
  body{background:#fff;font-size:11pt}
  body::before,.site-header,.rail,.dir,.view:not(#v-summary),.no-print{display:none!important}
  .layout{display:block;padding:0}
  #v-summary{display:block!important;border:0;box-shadow:none;padding:0}
  .view > *{max-width:none}
  .print-only{display:block}
  .big-scores div,.result{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,li{break-inside:avoid}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="mark" href="#brief" data-go="brief" aria-label="Identity and Access Lab, briefing">
      <svg width="34" height="40" viewBox="0 0 34 40" aria-hidden="true"><rect x="1" y="4" width="32" height="35" rx="6" fill="#0047AB"/><rect x="12" y="1" width="10" height="7" rx="3" fill="#00a86b"/><circle cx="17" cy="19" r="6" fill="#fff"/><rect x="8" y="29" width="18" height="4" rx="2" fill="#fff" opacity=".85"/></svg>
      <span><b>Identity and Access Lab</b><small>Lakeshore Health Partners</small></span>
    </a>
    <div class="meter" aria-live="polite"><span class="mtext" id="meter-text">0 of 5 missions checked</span><span class="track"><span class="fill" id="meter-fill"></span></span></div>
    <button class="btn small" id="theme-btn" type="button" aria-pressed="false"><span class="ticon" aria-hidden="true">☾</span><span class="tlabel">Dark mode</span></button>
  </div>
</header>

<div class="layout">
  <nav class="rail" aria-label="Missions">

function gradeM1(){
 return TICKETS.map(function(t){

   if(d!=='reject')errs.push(d?'A shared login means no one is individually accountable for what happens under it, and you can’t remove one receptionist without locking out the others. Reject it.':'Make a decision: provision or reject.');
   else if(A(t.id+'.reason')!=='individual')errs.push('Choose the reason that names the real problem: shared accounts break accountability and non-repudiation.');
   return item(t.id,t.req+' shared front desk login',!errs.length,'Rejected for the right reason. Each receptionist gets an individual account; a shared check-in PC can use fast user switching or badge tap sign-in instead.',errs.join(' '),['K1','A1','A4']);
  }
  if(d!=='provision')errs.push(d?'This is a legitimate joiner request from HR, so provision it.':'Make a decision: provision or reject.');
  else{
   var u=(A(t.id+'.user')||'').trim();
   if(u!==t.user){
    if(t.taken&&u===t.taken)errs.push(t.taken+' already belongs to Dana Price in Radiology. Apply the collision rule: '+t.user+'.');
    else if(u.toLowerCase()===t.user)errs.push('Usernames are all lowercase.');

   }
   if(A(t.id+'.type')!==t.type)errs.push('Set the account type to '+(t.type==='contractor'?'Contractor':'Employee')+' to match HR’s record.');
   var x=A(t.id+'.exp')||'';
   if(t.type==='contractor'){if(!x)errs.push('Contractor accounts need an expiration date so access ends automatically with the contract.');else if(x!==t.exp)errs.push('Set the expiration to the contract end date, Mar 31, 2027.');}

   var pw=A(t.id+'.pw');
   if(pw!=='temp')errs.push(pw==='default'?'A standard default password is known to everyone who has ever been onboarded.':pw==='empid'?'Employee IDs appear on badges and paperwork, so they make predictable passwords.':'Choose an initial credential.');
  }

  return item(t.id,t.req+' '+t.name,!errs.length,okText,errs.join(' '),['K1','S1']);
 });

 var out=[];
 ACCOUNTS.forEach(function(a){var v=A('acct.'+a.id),name=ACTIONS.filter(function(x){return x[0]===a.ans;})[0][1];out.push(item('acct.'+a.id,'Access review: '+a.id,v===a.ans,a.why,v?'The right action is “'+name+'.” '+a.why:'Choose an action.',['S5','A3','K1']));});
 LOGS.forEach(function(l){var v=A('log.'+l.id),want=l.sus?'sus':'normal';out.push(item('log.'+l.id,'Log entry: '+l.actor+', '+l.time,v===want,l.why,v?'This entry is '+(l.sus?'suspicious':'normal')+'. '+l.why:'Mark it normal or suspicious.',['S5','A3']));});
 var p=A('aud.prevent');
 out.push(item('aud.prevent','Root-cause fix',p==='auto','Automated leaver deprovisioning from HR, plus contractor expirations, removes the human delay that left both accounts active.',p?'Both findings came from deprovisioning that depended on someone remembering. Automate it from the HR system of record and set contractor expirations.':'Choose an answer.',['K1','A4']));
 return out;
}
var GRADERS={m1:gradeM1,m2:gradeM2,m3:gradeM3,m4:gradeM4,m5:gradeM5};

/* ---------- directory ---------- */
var issuedBefore={};
function badgeHTML(o){
 var fresh=!o.pending&&!issuedBefore[o.key];
 if(!o.pending)issuedBefore[o.key]=true; else delete issuedBefore[o.key];
 return '<div class="badge'+(o.pending?' pending':'')+(o.alert?' alert':'')+(o.priv?' priv':'')+(fresh&&dirReady?' fresh':'')+'"><div class="band">'+(o.alert?'Shared account':o.priv?'Privileged account':'Lakeshore Health Partners')+'</div><div class="b-body"><div class="avatar" aria-hidden="true">'+initials(o.name)+'</div><div><p class="b-name">'+o.name+'</p><p class="b-title">'+o.title+'</p><p class="b-user">'+esc(o.user)+'</p></div></div><div class="chips">'+o.chips.join('')+'</div></div>';
}
var dirReady=false;
function renderDirectory(){
 var issued=0;
 var html=PEOPLE.map(function(t){
  var prov=A(t.id+'.decision')==='provision',u=(A(t.id+'.user')||'').trim(),m=A('mfa.'+t.group),role=A('assign.'+t.id),chips=[];
  if(prov){issued++;var ct=A(t.id+'.type');chips.push('<span class="chip">'+(ct==='contractor'?'Contractor'+(A(t.id+'.exp')?', expires '+fmtDate(A(t.id+'.exp')):', no expiration set'):ct==='employee'?'Employee':'Type not set')+'</span>');}
  chips.push(m?'<span class="chip '+(m==='none'||m==='sms'?'warn':'good')+'">MFA: '+MSHORT[m]+'</span>':'<span class="chip dim">MFA not set</span>');
  chips.push(role?'<span class="chip">'+ROLE_LABEL[role]+'</span>':'<span class="chip dim">No role</span>');
  return badgeHTML({key:t.id,name:t.name,title:t.title,user:prov?(u||'username not set'):'not provisioned',pending:!prov,chips:chips});
 });
 if(A('t5.decision')==='provision')html.push(badgeHTML({key:'t5',name:'Front desk',title:'Shared by three receptionists',user:(A('t5.user')||'frontdesk'),alert:true,chips:['<span class="chip bad">No accountable owner</span>']}));
 if(A('pam.sep')==='sep'){var pm=A('mfa.priv');html.push(badgeHTML({key:'adm',name:'Priya Natarajan',title:'Admin tasks only',user:'adm-pnatarajan',priv:true,chips:['<span class="chip '+(pm==='fido'?'good':'warn')+'">MFA: '+(pm?MSHORT[pm]:'not set')+'</span>','<span class="chip">Just-in-time elevation</span>']}));}
 $('#badges').innerHTML=html.join('');
 $('#dir-count').textContent=issued+' of 5 new hires provisioned. Your MFA and role decisions appear on each badge.';
 dirReady=true;
}

/* ---------- navigation ---------- */
function renderRail(){
 $('#rail-list').innerHTML=VIEWS.map(function(v){
  var r=S.res[v.id],n,s=v.sub;
  if(v.n){var cls=r?(r.score===r.total?'done':'part'):'';n='<span class="n '+cls+'" aria-hidden="true">'+(r&&r.score===r.total?'✓':v.n)+'</span>';if(r)s=r.score+' of '+r.total+' correct';}
  else n='<span class="n" aria-hidden="true">'+(v.id==='brief'?'i':'Σ')+'</span>';
  return '<li><button type="button" data-go="'+v.id+'"'+(S.view===v.id?' aria-current="page"':'')+'>'+n+'<span class="t">'+v.label+'<span class="s">'+s+'</span></span></button></li>';
 }).join('');
 var checked=MISSIONS.filter(function(m){return S.res[m];}).length;
 $('#meter-text').textContent=checked+' of 5 missions checked';
 $('#meter-fill').style.width=(checked/5*100)+'%';
}
function renderView(id){document.getElementById('v-'+id).innerHTML=RENDER[id]();}
function go(id,noFocus){
 if(!RENDER[id])id='brief';
 S.view=id;save();
 VIEWS.forEach(function(v){document.getElementById('v-'+v.id).hidden=v.id!==id;});
 if(id==='summary')renderView('summary');
 renderRail();
 if(!noFocus){
  var h=document.querySelector('#v-'+id+' [tabindex="-1"]');
  var top=$('#main').getBoundingClientRect().top+window.scrollY-90;
  if(window.scrollY>top)window.scrollTo({top:Math.max(0,top)});
  if(h)h.focus({preventScroll:true});
 }
 try{history.replaceState(null,'','#'+id);}catch(e){}
}
function check(mid){
 var items=GRADERS[mid](),score=items.filter(function(i){return i.ok;}).length;
 S.res[mid]={items:items,score:score,total:items.length,ts:Date.now()};
 if(!S.first[mid])S.first[mid]={score:score,total:items.length,ts:Date.now()};
 S._fresh=mid;save();
 renderView(mid);S._fresh=null;
 renderRail();
 var el=document.getElementById('result-'+mid);
 if(el){el.scrollIntoView({block:'center',behavior:(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'auto':'smooth'});el.focus({preventScroll:true});}
}
function updateName(){
 var nm=A('name')||'';
 document.querySelectorAll('.you-name').forEach(function(e){e.textContent=nm||(e.closest('#v-summary')?'Name not entered':'Your name here');});
 document.querySelectorAll('.you-init').forEach(function(e){e.textContent=nm?initials(nm):'IA';});
}
function updateThemeBtn(){
 var d=document.documentElement.getAttribute('data-theme')==='dark',b=$('#theme-btn');
 b.setAttribute('aria-pressed',String(d));
 b.querySelector('.tlabel').textContent=d?'Light mode':'Dark mode';
 b.querySelector('.ticon').textContent=d?'☀':'☾';
}

/* ---------- events ---------- */
document.addEventListener('change',function(e){
 var t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
 if(t.type==='checkbox')S.a[k]=t.checked;
 else if(t.type==='radio'||t.tagName==='SELECT')S.a[k]=t.value;
 else return;
 if(t.dataset.vis){var c=t.closest('[data-decision]');if(c)c.setAttribute('data-decision',t.value);}
 save();renderDirectory();
});
document.addEventListener('input',function(e){
 var t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
 if(t.type==='checkbox'||t.type==='radio'||t.tagName==='SELECT')return;
 S.a[k]=t.value;save();
 if(k==='name'){updateName();document.querySelectorAll('[data-k="name"]').forEach(function(x){if(x!==t)x.value=t.value;});}
 if(k==='reflect'){var p=document.getElementById('reflect-print');if(p)p.textContent=t.value||'No reflection entered.';}
 renderDirectory();
});
document.addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.getAttribute('data-go'));return;}
 var c=e.target.closest('[data-check]');if(c){check(c.getAttribute('data-check'));return;}
 var f=e.target.closest('[data-factor]');
 if(f){var id=f.getAttribute('data-factor');selFactor=selFactor===id?null:id;renderView('m2');var el=document.querySelector('[data-factor="'+id+'"]');if(el)el.focus();if(selFactor){var h=$('#factor-hint');h.style.color='var(--ink-2)';h.textContent='Now select a category for “'+FACTORS.filter(function(x){return x.id===id;})[0].label+'.”';}return;}
 var b=e.target.closest('[data-bucket]');
 if(b){var bk=b.getAttribute('data-bucket');
  if(!selFactor){var hh=$('#factor-hint');hh.style.color='';hh.textContent='Select a factor first, then select its category.';return;}
  if(bk)S.a['f.'+selFactor]=bk;else delete S.a['f.'+selFactor];
  selFactor=null;save();renderView('m2');var be=document.querySelector('[data-bucket="'+bk+'"]');if(be)be.focus();return;}
 if(e.target.closest('#theme-btn')){var r=document.documentElement,nt=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',nt);try{localStorage.setItem('iam-lab-theme',nt);}catch(err){}updateThemeBtn();return;}
 if(e.target.closest('[data-print]')){renderView('summary');setTimeout(function(){window.print();},50);return;}
 if(e.target.closest('[data-reset]')){if(confirm('Clear all answers and scores and start over?')){S={a:{},res:{},first:{},view:'brief'};selFactor=null;issuedBefore={};dirReady=false;save();renderAll();go('brief');}}
});
window.addEventListener('beforeprint',function(){renderView('summary');});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==S.view&&RENDER[h])go(h);});

function renderAll(){VIEWS.forEach(function(v){renderView(v.id);});renderDirectory();renderRail();}
renderAll();updateThemeBtn();
(function(){var h=location.hash.slice(1);go(RENDER[h]?h:(S.view||'brief'),true);})();
</script>
</body>
</html>
